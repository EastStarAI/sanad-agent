# Shipped thinking-capability defaults (layer 3 of the thinking authority).
#
# Same schema as the `model_capabilities` section of $SANAD_HOME/config.yaml:
# entries are keyed by exact model id and carry one `thinking_control` record.
# Extra data-only fields per entry:
#   source:          documentation URL the facts come from (required).
#   note:            optional free-text provenance note.
#   aliases:         additional exact ids that share this record.
#   routes:          route class where the record applies (default by wire):
#                      any    - wherever the wire is compatible (effort wires
#                               follow the route between Chat and Responses);
#                      native - first-party/partner native Chat dialects and
#                               the aggregator;
#                      first_party - like native, but never on a partner
#                               Chat route (OpenCode Go): there the serving
#                               route's own models.dev entry answers. Use it
#                               when the partner's serving evidence contradicts
#                               the first-party record;
#                      google - the Gemini template and the aggregator;
#                      nim    - the hosted NVIDIA NIM catalog only.
#                    Defaults: native_toggle_effort -> native,
#                    google_thinking -> google, nim_* -> nim, else any.
#   compatible_chat: positive_efforts - on a generic compatible Chat route the
#                    record degrades to its positive efforts with no Off and
#                    no default (the native envelope is not evidenced there).
#
# Facts were carried from the model-name tables removed after git 2607a342
# (agent/lib/core/provider_thinking/*_catalog.dart and *_policy.dart).
# Regenerate: fvm dart run tool/generate_model_capability_defaults.dart
