# Non-secret daemon policy. Copy to $SANAD_HOME/config.yaml and restart Sanad.
context:
  # Global ceiling for every resolved model window (shipped defaults and
  # provider/catalog/models.dev values alike). Built-in default 358000.
  # 0 = no cap. A value between 1 and 8191 is rejected.
  maxLimit: 358000
  # Strongest layer: applied as written and never capped. Merged key by key with
  # the shipped per-model defaults (gpt-6.1-sol 258000,
  # deepseek-v4.1-flash 358000).
  modelLimits:
    gpt-5.6-sol: 258000

compaction:
  threshold: 0.90
  targetRatio: 0.10
  # Bound for one compaction provider pass to return its whole response.
  passTimeoutSeconds: 600
  models:
    gpt-5.6-sol:
      threshold: 0.90
      targetRatio: 0.08

# Diagnostic policy. Request dumps (`DUMP_REQUESTS`) are mutable diagnostic
# state, so the daemon keeps a bounded window instead of growing the directory
# forever. Older dump files are deleted at daemon start and once a day.
diagnostics:
  requestDumpRetentionDays: 3

# Thinking-control override (layer 1 of the thinking authority). Keyed by the
# exact model id, with no wildcards and no provider scoping. It replaces the
# provider-reported, shipped (`model_capability_defaults.yaml`) and models.dev
# records for that model as a whole. Wires: openai_chat_effort,
# codex_responses_effort, native_toggle_effort, toggle_effort,
# anthropic_adaptive, anthropic_budget, google_thinking, nim_kimi_thinking,
# nim_qwen_thinking.
model_capabilities:
  deepseek-v4.1-flash:
    thinking_control:
      status: supported
      wire: native_toggle_effort
      options:
        off: false
        high: high
        max: max
      default_option: high
