name: Set up project Flutter and FVM
description: Installs the exact Flutter SDK declared by the repository, reuses it for FVM, and restores the pub cache.
runs:
  using: composite
  steps:
    - uses: subosito/flutter-action@v2
      with:
        flutter-version-file: .fvmrc
        cache: true
    - uses: actions/cache@v6
      if: runner.os != 'Windows'
      with:
        path: ~/.pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('.fvmrc', '**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-
    - uses: actions/cache@v6
      if: runner.os == 'Windows'
      with:
        path: ~\AppData\Local\Pub\Cache
        key: pub-${{ runner.os }}-${{ hashFiles('.fvmrc', '**/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-
    - shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
        if [ -z "$version" ]; then
          echo "::error::.fvmrc does not declare a Flutter version"
          exit 1
        fi
        sdk_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
        # The pub cache keeps its platform default; only its bin directory has
        # to be published to later steps, in the platform's own path form.
        cache="$HOME/.fvm-cache"
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          pub_cache="${PUB_CACHE:-${LOCALAPPDATA}\\Pub\\Cache}"
          echo "${pub_cache}\\bin" >> "$GITHUB_PATH"
          cache="$(cygpath -u "$cache")"
          fvm_cache="$(cygpath -w "$cache")"
        else
          echo "${PUB_CACHE:-$HOME/.pub-cache}/bin" >> "$GITHUB_PATH"
          fvm_cache="$cache"
        fi
        mkdir -p "$cache/versions"
        link="$cache/versions/$version"
        rm -rf "$link"
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          powershell -NoProfile -Command \
            "New-Item -ItemType Junction -Path '$(cygpath -w "$link")' -Target '$(cygpath -w "$sdk_root")' | Out-Null"
        else
          ln -s "$sdk_root" "$link"
        fi
        echo "FVM_CACHE_PATH=$fvm_cache" >> "$GITHUB_ENV"
        export FVM_CACHE_PATH="$fvm_cache"
        dart pub global activate fvm
        # The SDK above is already cached by flutter-action, so this install only
        # registers the pinned version with FVM instead of downloading it again.
        dart pub global run fvm:main install
    # PATH entries only apply to later steps, so the FVM version assertion runs
    # in its own step. On Windows the FVM shim is a batch file, which only the
    # command interpreter resolves, so it is invoked through cmd there.
    - shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/.*"flutter"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .fvmrc)"
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          resolved="$(cmd //c fvm flutter --version | head -n1)"
        else
          resolved="$(fvm flutter --version | head -n1)"
        fi
        case "$resolved" in
          *" $version "*) echo "FVM resolves Flutter $version" ;;
          *)
            echo "::error::FVM resolved '$resolved' instead of Flutter $version"
            exit 1
            ;;
        esac
