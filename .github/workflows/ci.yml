name: Public CI

on:
  pull_request:
    # Protected review labels are re-verified on demand through
    # protected-labels.yml, so label changes never restart full CI.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The merge queue is disabled in favour of "require branches to be up to date".
  # This trigger and the merge-group paths below are kept dormant so a rollback to
  # the queue needs no workflow change (see docs/operations/continuous_integration.md).
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The post-merge complement run reads a proof run for the exact tree `main`
      # received: the merge-queue run if the queue is enabled, otherwise the
      # merged pull request's own run.
      actions: read
      pull-requests: read
    # One output per lane, not one per component: the post-merge complement run
    # has to skip exactly the lanes a proof run already proved, and two
    # lanes that share a component cannot express that.
    outputs:
      agent: ${{ steps.paths.outputs.agent }}
      client: ${{ steps.paths.outputs.client }}
      docs: ${{ steps.paths.outputs.docs }}
      release: ${{ steps.paths.outputs.release }}
      security: ${{ steps.paths.outputs.security }}
      agent_checks: ${{ steps.paths.outputs.agent_checks }}
      agent_tests: ${{ steps.paths.outputs.agent_tests }}
      supervisor_skill: ${{ steps.paths.outputs.supervisor_skill }}
      cli_automation: ${{ steps.paths.outputs.cli_automation }}
      native_stt: ${{ steps.paths.outputs.native_stt }}
      client_analyze: ${{ steps.paths.outputs.client_analyze }}
      client_tests: ${{ steps.paths.outputs.client_tests }}
      client_web: ${{ steps.paths.outputs.client_web }}
      sanad_dev: ${{ steps.paths.outputs.sanad_dev }}
      docs_governance: ${{ steps.paths.outputs.docs_governance }}
      release_security: ${{ steps.paths.outputs.release_security }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          classification_failed=false
          case "$EVENT_NAME" in
            pull_request|merge_group)
              if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]] ||
                ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null ||
                ! git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"; then
                classification_failed=true
                : > "$RUNNER_TEMP/changed"
              fi
              ;;
            *)
              if ! git ls-files > "$RUNNER_TEMP/changed"; then
                classification_failed=true
                : > "$RUNNER_TEMP/changed"
              fi
              ;;
          esac
          cat "$RUNNER_TEMP/changed"
          agent=false; client=false; docs=false; release=false; security=false
          # ---- Declared lane input sets --------------------------------------
          # `Native dictation` and `sanad-dev bootstrap` do not depend on a whole
          # component, so their triggers live in `scripts/ci/lane_inputs.txt`
          # instead of a component case. The file also owns the "run everything"
          # triggers: a path that matches an `all` pattern can change the meaning
          # of any lane (the workflow graph, the toolchain, dependency
          # resolution, the native sources, the shared runtime packages), so it
          # enables every lane rather than the lanes its component names.
          #
          # The same file is checked by agent/test/tool/ci_lane_inputs_test.dart,
          # which walks the Dart import closure of every declared entry and fails
          # when a file the lane executes escapes its declared globs - so a new
          # dependency cannot silently stop being tested.
          lane_inputs=scripts/ci/lane_inputs.txt
          all_patterns=(); native_patterns=(); sanad_dev_patterns=()
          match_any() {
            local path="$1"
            shift
            (( $# > 0 )) || return 1
            local pattern
            for pattern in "$@"; do
              # shellcheck disable=SC2254  # the pattern is the point
              case "$path" in $pattern) return 0 ;; esac
            done
            return 1
          }
          if [[ ! -f "$lane_inputs" ]]; then
            echo "::error::$lane_inputs is missing; running every lane."
            classification_failed=true
          else
            while read -r kind lane pattern; do
              [[ -z "${kind:-}" || "$kind" == '#'* ]] && continue
              case "$kind" in
                glob)
                  case "$lane" in
                    all) all_patterns+=("$pattern") ;;
                    native-stt) native_patterns+=("$pattern") ;;
                    sanad-dev) sanad_dev_patterns+=("$pattern") ;;
                    *)
                      echo "::error::$lane_inputs declares an unknown lane '$lane'."
                      classification_failed=true
                      ;;
                  esac
                  ;;
                entry) ;;
                *)
                  echo "::error::$lane_inputs declares an unknown kind '$kind'."
                  classification_failed=true
                  ;;
              esac
            done < "$lane_inputs"
          fi
          every_lane=false
          native_inputs=false
          sanad_dev_inputs=false
          # `agent/test/fixtures/cli_relay_grammar.json` is Agent-owned but the
          # Client reads it as a cross-component contract, so a change to it
          # must run the Client lanes too. Add every Agent-to-Client contract
          # fixture here; docs/operations/continuous_integration.md owns the rule.
          while IFS= read -r path; do
            case "$path" in agent/*|.agents/skills/*|shared/auth_lock/*|release/contract/*|release/release-contract.json) agent=true ;; esac
            case "$path" in client/*|shared/auth_lock/*|release/contract/*|release/release-contract.json|agent/test/fixtures/cli_relay_grammar.json) client=true ;; esac
            case "$path" in *.md|docs/*|.vscode/*|.agents/*|.github/ISSUE_TEMPLATE/*|.github/DISCUSSION_TEMPLATE/*|.github/labels.yml|.github/CODEOWNERS|.github/PULL_REQUEST_TEMPLATE.md|scripts/community/*) docs=true ;; esac
            case "$path" in .github/workflows/*|release/*|client/release/*|agent/tool/release_*.dart|scripts/release/*|scripts/install.sh|scripts/install.ps1) release=true ;; esac
            case "$path" in SECURITY.md|docs/operations/code_signing_policy.md|shared/auth_lock/*|shared/auth_lock/**/*|agent/lib/core/auth/*|agent/lib/core/auth/**/*|agent/lib/capabilities/permissions/*|agent/lib/capabilities/permissions/**/*) security=true ;; esac
            if match_any "$path" "${all_patterns[@]+"${all_patterns[@]}"}"; then every_lane=true; fi
            if match_any "$path" "${native_patterns[@]+"${native_patterns[@]}"}"; then native_inputs=true; fi
            if match_any "$path" "${sanad_dev_patterns[@]+"${sanad_dev_patterns[@]}"}"; then sanad_dev_inputs=true; fi
          done < "$RUNNER_TEMP/changed"
          # A broken classifier must never skip validation, so every path that
          # matches nothing at all, every non-pull-request event, and every
          # classification failure still runs everything. A path that matched a
          # declared lane input is classified, not unmatched, which is what lets
          # a `scripts/sanad_dev` change stay inside its own lane.
          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "merge_group" ]] ||
            [[ "$classification_failed" == true ]] ||
            [[ "$agent$client$docs$release$security$native_inputs$sanad_dev_inputs" == falsefalsefalsefalsefalsefalsefalse ]]; then
            echo "Classifier fallback: running every validation lane."
            every_lane=true
          fi
          if [[ "$every_lane" == true ]]; then
            echo "A path that can change any lane matched (or the classifier could not decide): running every validation lane."
            agent=true; client=true; docs=true; release=true; security=true
            native_inputs=true; sanad_dev_inputs=true
          fi

          # ---- Post-merge complement run -------------------------------------
          # The tree `main` just received may already have been proved. Between
          # 2026-11-08 and 2026-11-10, while merges went through the queue, that
          # was true for 46 of 46 pushes: the queue fast-forwarded `main` to the
          # commit a `merge_group` run had just built and passed. Repeating every
          # lane on the same tree bought no coverage and cost ~60 runner-minutes
          # per merge, including four macOS jobs against a five-job account cap.
          #
          # Two proof sources are accepted, in order, and only on `push`:
          #
          # A. `merge_group` run - the queue built this exact commit. This is the
          #    rollback path; no such run exists while merges are up-to-date merges.
          # B. the merged pull request's own `pull_request` run - accepted only
          #    when all of these hold: the commit resolves to exactly one merged
          #    pull request, that pull request's head tree is byte-identical to
          #    this commit's tree, and the head contains this commit's parent so
          #    the run was made against the same base as well as the same content.
          #    Source B is what the live model relies on: `main` requires the head
          #    to contain the current `main` tip, so the pull request's own run is
          #    the proof that this tree passed, and a squash merge lands that tree.
          #
          # A lane counts as proven only when a job for it actually executed and
          # succeeded; a job the run skipped proves nothing. Anything else - no
          # matching run, a run that is not successful, a different tree, a
          # commit with several pull requests, an unreadable API - keeps the full
          # lane set, so the common failure mode of this step is "run every lane".
          #
          # Jobs that are genuinely post-merge work are not part of the reduction:
          # `Verify branch history`, `Verify protected review labels`, and
          # `Validate release and security boundaries` (whose credential scan
          # covers the pushed range, not the pull-request range) always run.
          complement=false
          proven=" "
          # Appends the lanes a successful run executed to $proven.
          collect_proven_lanes() {
            local run_id="$1" jobs job_name job_conclusion
            if ! jobs="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" \
              --jq '.jobs[] | "\(.name)|\(.conclusion)"' 2>"$RUNNER_TEMP/jobs.err")"; then
              echo "::warning::Could not read the jobs of run $run_id." >&2
              cat "$RUNNER_TEMP/jobs.err" >&2 || true
              return 1
            fi
            while IFS='|' read -r job_name job_conclusion; do
              [[ "$job_conclusion" == success ]] || continue
              # Matrix job names carry a "(<label>)" suffix; the lane is the
              # stable prefix. A successful run guarantees every shard of a
              # proven lane passed, because the run only succeeds when all of
              # its jobs do.
              case "${job_name%% (*}" in
                "Agent contract checks and analyze") proven+="agent-checks " ;;
                "Test agent") proven+="agent-tests " ;;
                "Supervisor skill tests") proven+="supervisor-skill " ;;
                "CLI automation") proven+="cli-automation " ;;
                "Native dictation") proven+="native-stt " ;;
                "Analyze client") proven+="client-analyze " ;;
                "Test client") proven+="client-tests " ;;
                "Web startup composition") proven+="client-web " ;;
                "sanad-dev bootstrap") proven+="sanad-dev " ;;
                "Validate docs and governance") proven+="docs-governance " ;;
              esac
            done <<< "$jobs"
            return 0
          }
          # A. Proof from the merge queue (dormant; kept for rollback).
          prove_from_merge_queue() {
            local runs_json run_id
            if ! runs_json="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&per_page=100" \
              2>"$RUNNER_TEMP/runs.err")"; then
              echo "::warning::Could not read merge-queue runs for $GITHUB_SHA." >&2
              cat "$RUNNER_TEMP/runs.err" >&2 || true
              return 1
            fi
            run_id="$(jq -r --arg sha "$GITHUB_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")]
              | sort_by(.run_started_at) | reverse | (.[0].id // empty)' <<< "$runs_json")"
            if [[ -z "$run_id" ]]; then
              echo "No successful merge-queue run for $GITHUB_SHA." >&2
              return 1
            fi
            collect_proven_lanes "$run_id" || return 1
            proof="merge-queue run $run_id"
            return 0
          }
          # B. Proof from the merged pull request's own run.
          prove_from_merged_pull_request() {
            local pr_json count head_sha pr_number head_ref head_prs head_tree tree parent status runs_json run_id
            if ! pr_json="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              2>"$RUNNER_TEMP/pr.err")"; then
              echo "::warning::Could not read the pull requests for $GITHUB_SHA." >&2
              cat "$RUNNER_TEMP/pr.err" >&2 || true
              return 1
            fi
            count="$(jq 'length' <<< "$pr_json")"
            if [[ "$count" != 1 ]]; then
              echo "$GITHUB_SHA resolves to $count pull requests; not reusing a pull-request proof." >&2
              return 1
            fi
            head_sha="$(jq -r '(.[0].head.sha // empty)' <<< "$pr_json")"
            pr_number="$(jq -r '(.[0].number // empty)' <<< "$pr_json")"
            head_ref="$(jq -r '(.[0].head.ref // empty)' <<< "$pr_json")"
            if [[ -z "$head_sha" || -z "$pr_number" || -z "$head_ref" ]] ||
              [[ "$(jq -r '(.[0].merged_at // empty)' <<< "$pr_json")" == "" ]] ||
              [[ "$(jq -r '(.[0].base.ref // empty)' <<< "$pr_json")" != main ]]; then
              echo "$GITHUB_SHA was not produced by a pull request merged into main." >&2
              return 1
            fi
            # A `pull_request` run is keyed by head SHA only, so it is attributable
            # to this pull request only when no other pull request (open, closed,
            # or merged, to any base) has the same head: a second one targeting
            # another base would have a run that tested a different merge.
            if ! head_prs="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$head_sha/pulls" \
              --jq "[.[] | select(.head.sha == \"$head_sha\")] | map(\"\(.number) \(.base.ref)\") | join(\",\")" \
              2>"$RUNNER_TEMP/head-prs.err")"; then
              cat "$RUNNER_TEMP/head-prs.err" >&2 || true
              return 1
            fi
            if [[ "$head_prs" != "$pr_number main" ]]; then
              echo "Head $head_sha belongs to pull requests [${head_prs}], not only #$pr_number into main; not reusing a pull-request proof." >&2
              return 1
            fi
            # Same tree is the proof: a squash merge lands the head's content.
            if ! tree="$(git rev-parse "$GITHUB_SHA^{tree}")" ||
              ! parent="$(git rev-parse "$GITHUB_SHA^")"; then
              echo "Could not resolve the tree or parent of $GITHUB_SHA." >&2
              return 1
            fi
            if ! head_tree="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq '.tree.sha' \
              2>"$RUNNER_TEMP/tree.err")"; then
              cat "$RUNNER_TEMP/tree.err" >&2 || true
              return 1
            fi
            if [[ "$head_tree" != "$tree" ]]; then
              echo "Pull request head $head_sha has tree $head_tree, not $tree." >&2
              return 1
            fi
            # The head must also contain the base this push replaced, so the
            # pull-request run proved the merge with the same `main`.
            status="$(gh api \
              "repos/$GITHUB_REPOSITORY/compare/$parent...$head_sha" --jq '.status' \
              2>"$RUNNER_TEMP/compare.err" || true)"
            case "$status" in
              ahead|identical) ;;
              *)
                cat "$RUNNER_TEMP/compare.err" >&2 || true
                echo "Pull request head $head_sha does not contain $parent (status: ${status:-unknown})." >&2
                return 1
                ;;
            esac
            if ! runs_json="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head_sha&per_page=100" \
              2>"$RUNNER_TEMP/pr-runs.err")"; then
              cat "$RUNNER_TEMP/pr-runs.err" >&2 || true
              return 1
            fi
            run_id="$(jq -r --arg sha "$head_sha" --arg ref "$head_ref" '
              [.workflow_runs[] | select(.head_sha == $sha and .head_branch == $ref
                and .event == "pull_request" and .conclusion == "success")]
              | sort_by(.run_started_at) | reverse | (.[0].id // empty)' <<< "$runs_json")"
            if [[ -z "$run_id" ]]; then
              echo "No successful pull-request run for $head_sha." >&2
              return 1
            fi
            collect_proven_lanes "$run_id" || return 1
            proof="pull-request run $run_id for pull request head $head_sha"
            return 0
          }
          if [[ "$EVENT_NAME" == push ]]; then
            proof=""
            if prove_from_merge_queue; then
              complement=true
            elif prove_from_merged_pull_request; then
              complement=true
            else
              echo "No reusable proof for $GITHUB_SHA; running every lane."
              proven=" "
            fi
            if [[ "$complement" == true ]]; then
              proven=" $(tr ' ' '\n' <<< "$proven" | sed '/^$/d' | sort -u | tr '\n' ' ')"
              echo "Proven by ${proof}:${proven}"
            fi
          fi
          # A lane the queue proved is skipped; every other lane keeps whatever
          # its component classification decided.
          keep_proven() {
            local lane="$1" value="$2"
            if [[ "$complement" == true && "$proven" == *" $lane "* ]]; then
              echo false
            else
              echo "$value"
            fi
          }
          # The credential scan is bounded to the pushed range, which no
          # merge-group run covers, so this lane is never reduced.
          release_security=false
          if [[ "$release" == true || "$security" == true ]]; then release_security=true; fi
          {
            echo "agent=$agent"
            echo "client=$client"
            echo "docs=$docs"
            echo "release=$release"
            echo "security=$security"
            echo "agent_checks=$(keep_proven agent-checks "$agent")"
            echo "agent_tests=$(keep_proven agent-tests "$agent")"
            echo "supervisor_skill=$(keep_proven supervisor-skill "$agent")"
            echo "cli_automation=$(keep_proven cli-automation "$agent")"
            echo "native_stt=$(keep_proven native-stt "$native_inputs")"
            echo "client_analyze=$(keep_proven client-analyze "$client")"
            echo "client_tests=$(keep_proven client-tests "$client")"
            echo "client_web=$(keep_proven client-web "$client")"
            echo "sanad_dev=$(keep_proven sanad-dev "$sanad_dev_inputs")"
            echo "docs_governance=$(keep_proven docs-governance "$docs")"
            echo "release_security=$release_security"
          } >> "$GITHUB_OUTPUT"

  history:
    name: Verify branch history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null

  agent-checks:
    name: Agent contract checks and analyze
    needs: classify
    if: needs.classify.outputs.agent_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Validate release contract
        working-directory: agent
        run: |
          fvm flutter pub get
          fvm dart run tool/release_tool.dart validate-contract --repo-root ..
          fvm dart run tool/release_tool.dart check-preparation --repo-root ..
          version="$(jq -r '.version' ../release/release-contract.json)"
          fvm dart run tool/release_tool.dart validate-contract \
            --repo-root .. --tag "v${version}-rc.1" --channel rc
      - name: Reject mismatched release identities
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          reject() {
            if fvm dart run tool/release_tool.dart validate-contract \
              --repo-root .. "$@" >/dev/null 2>&1; then
              echo "::error::Invalid release identity was accepted: $*"
              exit 1
            fi
          }
          version="$(jq -r '.version' ../release/release-contract.json)"
          build="$(jq -r '.build_number' ../release/release-contract.json)"
          reject --tag "v${version}-beta.1" --channel rc
          reject --tag "v${version}-rc.1" --channel stable
          contract=../release/release-contract.json
          backup="$RUNNER_TEMP/release-contract.json"
          cp "$contract" "$backup"
          trap 'cp "$backup" "$contract"' EXIT
          jq --argjson b "$((build + 99))" '.build_number = $b' "$backup" > "$contract"
          reject --tag "v${version}" --channel stable
          jq '.version = "99.99.99" | .tag = "v99.99.99"' "$backup" > "$contract"
          reject --tag "v99.99.99" --channel stable
      - name: Reject an incomplete official Agent matrix
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          contract=../release/release-contract.json
          backup="$RUNNER_TEMP/release-contract-arm64.json"
          cp "$contract" "$backup"
          trap 'cp "$backup" "$contract"' EXIT
          jq '.artifacts |= map(
            select((.component == "agent" and
              .platform == "linux" and
              .architecture == "arm64") | not))' "$backup" > "$contract"
          if fvm dart run tool/release_tool.dart validate-contract \
            --repo-root .. >/dev/null 2>"$RUNNER_TEMP/arm64-rejection.log"; then
            echo "::error::A contract without the Linux arm64 Agent was accepted."
            exit 1
          fi
          grep -F 'linux/arm64' "$RUNNER_TEMP/arm64-rejection.log"
      - name: Validate embedded product skills
        working-directory: agent
        run: fvm dart run tool/generate_bundled_skills.dart --check
      - name: Validate shipped model capability defaults
        working-directory: agent
        run: fvm dart run tool/generate_model_capability_defaults.dart --check
      - name: Analyze agent
        working-directory: agent
        run: fvm dart analyze
      - name: Analyze the dictation engine package
        working-directory: agent
        # The engine is a swappable local package excluded from the package-wide
        # analysis (only one of the two can resolve), so the lane that selected it
        # analyzes it explicitly.
        run: |
          set -o pipefail
          engine=packages/stt_sherpa
          if [ -f pubspec_overrides.yaml ]; then engine=packages/stt_sherpa_stub; fi
          fvm dart analyze "$engine"
      - name: Test CWD-sensitive suites in isolation
        working-directory: agent
        run: |
          set -o pipefail
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(../scripts/ci/list_test_shard.sh . --isolated)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No suite assigns the process working directory."
            exit 0
          fi
          fvm dart test --concurrency 1 "${files[@]}" \
            --file-reporter "json:$RUNNER_TEMP/agent-isolated.jsonl"
          echo "CWD-sensitive suites ran $(../scripts/ci/test_event_counts.sh "$RUNNER_TEMP/agent-isolated.jsonl")."

  agent-tests:
    name: Test agent (${{ matrix.shard }}/4)
    needs: classify
    if: needs.classify.outputs.agent_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      TOTAL_SHARDS: 4
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Test agent shard ${{ matrix.shard }}/4
        working-directory: agent
        run: |
          set -o pipefail
          fvm dart pub get
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(../scripts/ci/list_test_shard.sh . "$((SHARD - 1))" "$TOTAL_SHARDS")
          echo "Shard $SHARD/$TOTAL_SHARDS runs ${#files[@]} test files."
          status=0
          fvm dart test "${files[@]}" \
            --file-reporter "json:$RUNNER_TEMP/agent-tests.jsonl" || status=$?
          echo "Agent shard $SHARD/$TOTAL_SHARDS ran $(../scripts/ci/test_event_counts.sh "$RUNNER_TEMP/agent-tests.jsonl")."
          exit "$status"

  # The delegate supervisor is Node code, so no Dart lane can execute it. Before
  # this job existed, every supervisor fix was verified by hand exactly once and
  # a regression could not fail a pull request (2026-11-09: three supervisor
  # fixes had merged while a live run still executed older code). The suite holds
  # one named scenario per past incident; see
  # `docs/operations/continuous_integration.md`.
  supervisor-skill:
    name: Supervisor skill tests
    needs: classify
    if: needs.classify.outputs.supervisor_skill == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Report the Node runtime
        run: node --version
      - name: Test the delegate supervisor
        working-directory: .agents/skills/delegate-task-supervisor
        run: |
          set -o pipefail
          node --test test/*_test.mjs

  cli-automation:
    name: CLI automation (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.cli_automation == 'true'
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm` proves the Agent compiles and answers as a native
        # arm64 executable on the same runner family the release matrix uses for
        # the official Linux arm64 artifact.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # The pinned Flutter SDK publishes no Linux arm64 archive, so the arm64
      # lane installs the standalone Dart SDK at exactly the same version.
      DART: ${{ matrix.os == 'ubuntu-24.04-arm' && 'dart' || 'fvm dart' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-dart
        if: matrix.os == 'ubuntu-24.04-arm'
      - uses: ./.github/actions/setup-fvm
        if: matrix.os != 'ubuntu-24.04-arm'
      - name: Select the whisper-only dictation engine
        if: matrix.os == 'ubuntu-24.04-arm'
        working-directory: agent
        # `sherpa_onnx` requires the Flutter SDK and this lane installs the
        # standalone Dart SDK, so the overlay swaps the engine for a stand-in
        # with the same package name. The Agent still compiles and dictates
        # through whisper.cpp; only streaming and VAD are absent.
        run: cp tool/pubspec_overrides.no_sherpa.yaml pubspec_overrides.yaml
      - name: Resolve agent dependencies
        working-directory: agent
        run: ${{ env.DART }} pub get
      - name: Verify isolated CLI contracts
        working-directory: agent
        run: ${{ env.DART }} test test/guards/e2e_state_isolation_contract_test.dart
      - name: Build packaged Windows no-console launcher
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S windows/launcher -B build/windows-launcher -A x64
          cmake --build build/windows-launcher --config Release
          fvm dart compile exe bin/sanad_agent.dart -o build/windows-launcher/sanad.exe
          fvm dart run tool/package_windows_launcher.dart --agent build/windows-launcher/sanad.exe --launcher build/windows-launcher/out/sanad-launcher.exe
          & build/windows-launcher/sanad.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows Agent smoke failed.' }
      - name: Verify AOT one-shot, pipe, and JSON output
        working-directory: agent
        env:
          SANAD_CLI_AOT_SUCCESS_FILE: .dart_tool/cli-aot-smoke-success
        run: ${{ env.DART }} run tool/cli_aot_smoke.dart
      - name: Require AOT smoke success marker
        if: runner.os != 'Windows'
        working-directory: agent
        shell: bash
        run: test -f .dart_tool/cli-aot-smoke-success
      - name: Require AOT smoke success marker on Windows
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          if (-not (Test-Path .dart_tool/cli-aot-smoke-success)) {
            throw 'AOT smoke did not complete successfully.'
          }

  native-stt:
    name: Native dictation (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.native_stt == 'true'
    strategy:
      fail-fast: false
      matrix:
        # `macos-15-intel` is the only genuine Intel evidence: cross-building
        # x86_64 on Apple Silicon would produce an untested slice, so the Intel
        # slice is compiled, loaded, and staged on Intel hardware. The arm64
        # Linux lane builds on its own CPU for the same reason, and the release
        # matrix publishes exactly the slices proven here.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # This job builds the runtime, so a missing or foreign-architecture one is
      # a defect: the smoke test fails instead of skipping.
      SANAD_STT_REQUIRE_NATIVE: '1'
      # The pinned Flutter SDK publishes no Linux arm64 archive, so that lane
      # installs the standalone Dart SDK at exactly the same version.
      DART: ${{ matrix.os == 'ubuntu-24.04-arm' && 'dart' || 'fvm dart' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-dart
        if: matrix.os == 'ubuntu-24.04-arm'
      - uses: ./.github/actions/setup-fvm
        if: matrix.os != 'ubuntu-24.04-arm'
      # The whisper shim is built from source on every desktop OS. The pinned tag
      # is the same one recorded in agent/native/checksums.json.
      - name: Fetch whisper.cpp
        uses: actions/checkout@v6
        with:
          repository: ggerganov/whisper.cpp
          ref: v1.9.5
          path: whisper.cpp
      - name: Cache whisper build
        uses: actions/cache@v4
        with:
          path: whisper.cpp/build
          # `v4` because two build contracts changed: the libraries are linked
          # with an `$ORIGIN` install rpath (`v3`), and ggml is now configured
          # `GGML_NATIVE=OFF` instead of `-march=native`, so the shipped runtime
          # no longer requires whatever CPU this runner happens to be. The
          # Makefile generator compares timestamps only, so a tree restored
          # under the old key would be reused unchanged and would ship
          # CPU-specific instructions again.
          key: whisper-build-v4-${{ matrix.os }}-whispercpp-v1.9.5-${{ hashFiles('agent/native/whispercpp/sanad_whisper.c') }}
      - name: Require the runner CPU the matrix label claims
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          expected=arm64
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then expected=x86_64; fi
          actual="$(uname -m)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::${{ matrix.os }} reported $actual, expected $expected"
            exit 1
          fi
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Select the whisper-only dictation engine
        if: matrix.os == 'ubuntu-24.04-arm'
        working-directory: agent
        run: cp tool/pubspec_overrides.no_sherpa.yaml pubspec_overrides.yaml
      - name: Resolve agent dependencies
        working-directory: agent
        run: ${{ env.DART }} pub get
      # The tool owns the platform tag, the required files, Metal per
      # architecture, and the CMake architecture/deployment target, so CI never
      # restates the layout. Every `bash` step here excludes Windows and has a
      # `pwsh` twin: the runner's fvm entry point is a `.bat` shim, and this
      # lane has no verified Git-Bash semantics.
      - name: Build the native runtime for this runner
        if: runner.os != 'Windows'
        working-directory: agent
        env:
          WHISPER_CPP_SRC: ${{ github.workspace }}/whisper.cpp
        shell: bash
        run: ${{ env.DART }} run tool/ensure_native_stt.dart
      - name: Build the native runtime for this runner
        if: runner.os == 'Windows'
        working-directory: agent
        env:
          WHISPER_CPP_SRC: ${{ github.workspace }}/whisper.cpp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart run tool/ensure_native_stt.dart
      # `--verify` disassembles the staged libraries and fails on any instruction
      # above the declared baseline, so it needs a disassembler. Image runners
      # ship one with the C toolchain this job already uses; installing it when
      # absent keeps the guard from silently skipping (`SANAD_STT_REQUIRE_NATIVE`
      # would turn that skip into a failure, but a clear install is better than a
      # red lane whose cause is packaging).
      - name: Install the disassembler the instruction-set guard needs
        if: runner.os == 'Linux'
        timeout-minutes: 8
        uses: ./.github/actions/apt-install
        with:
          packages: binutils
          options: ''
          skip-if-command: objdump
      - name: Report the disassembler
        if: runner.os == 'Linux'
        run: objdump --version | head -1
      - name: Verify the installed runtime and its manifest entry
        if: runner.os != 'Windows'
        working-directory: agent
        shell: bash
        run: ${{ env.DART }} run tool/ensure_native_stt.dart --verify
      - name: Verify the installed runtime and its manifest entry
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart run tool/ensure_native_stt.dart --verify
      - name: Load the built runtime in a real process
        working-directory: agent
        run: ${{ env.DART }} test test/stt/native_runtime_smoke_test.dart
      # Exercises the packaged-release producing path without publishing
      # anything: a staged runtime directory plus a reproducible archive whose
      # recorded sha256 is derived from the produced bytes. Member naming and
      # the no-model invariant are owned by agent/test/tool/stt_native_archive_test.dart
      # and the staging allowlist by agent/test/tool/stt_native_runtime_test.dart,
      # so no shell pipeline restates them here.
      - name: Stage and archive the runtime for packaging
        if: runner.os != 'Windows'
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          ${{ env.DART }} run tool/ensure_native_stt.dart \
            --stage ../dist-native \
            --archive ../dist-native
          test "$(ls ../dist-native/sanad-stt-*.tar.gz | wc -l | tr -d ' ')" = 1
      - name: Stage and archive the runtime for packaging
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart run tool/ensure_native_stt.dart --stage ../dist-native --archive ../dist-native
          $archives = @(Get-ChildItem -LiteralPath ../dist-native -Filter 'sanad-stt-*.tar.gz')
          if ($archives.Count -ne 1) {
            throw "Expected exactly one staged runtime archive."
          }
      # The staged folder is published so the arm64 payload can be exercised on
      # hardware that is older than the runner that built it — the one proof CI
      # cannot make, and exactly the gap that let v1.0.22 ship: `ldd` and the load
      # smoke both pass on the runner's own CPU. Linux only, because these are the
      # two slices that run on rented x64/arm64 hardware a user may not match.
      - name: Upload the staged Linux runtime
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-stt-runtime-linux-${{ matrix.os == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
          path: dist-native/native/linux-${{ matrix.os == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
          retention-days: 3
          if-no-files-found: error
      # The archive above is what a released Agent installs. This loads the
      # engine out of that staged payload, so a layout the loader cannot read
      # fails here instead of in the field. The linux-arm64 lane links the
      # whisper-only stand-in and asserts that instead.
      - name: Load the packaged sherpa runtime in a real process
        if: runner.os != 'Windows'
        working-directory: agent
        shell: bash
        env:
          SANAD_SHERPA_REQUIRE_NATIVE: '1'
        run: ${{ env.DART }} test test/stt/sherpa_runtime_smoke_test.dart
      - name: Load the packaged sherpa runtime in a real process
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        env:
          SANAD_SHERPA_REQUIRE_NATIVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart test test/stt/sherpa_runtime_smoke_test.dart
      # The two suites that own the operating-system half of the download path:
      # the digest selects a per-OS SHA-256 (CommonCrypto, OpenSSL EVP, or
      # BCrypt) and the write pipeline opens a second file handle for writeback.
      # Both fall back to a pure-Dart answer silently when a binding cannot load,
      # so they belong on the lanes that actually build the runtime for each
      # shipped operating system instead of on one Linux shard. They skip - not
      # fail - where the host genuinely has no OS implementation.
      #
      # `--concurrency 1` runs the two files one after the other. Neither file
      # compares two timings any more - both cost ratios own their own step and
      # process below - so this flag is not load-bearing for an assertion; it is
      # kept so a flake-fix change does not also reshape the step.
      - name: Verify the OS digest and the download write pipeline
        if: runner.os != 'Windows'
        working-directory: agent
        shell: bash
        run: |-
          ${{ env.DART }} test --concurrency 1 \
            test/stt/stt_digest_test.dart \
            test/stt/stt_download_pipeline_test.dart
      - name: Verify the OS digest and the download write pipeline
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |-
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart test --concurrency 1 test/stt/stt_digest_test.dart test/stt/stt_download_pipeline_test.dart
      # The digest's speed gate owns this file so it owns a process. What it
      # asserts is a ratio - the native SHA-256 against the pure-Dart one - and
      # the same rule as the pipeline gate below applies: measured beside another
      # suite, or always in the same order, it charges the shorter arm for its
      # neighbours' contention. `macos-15-intel` measured 2.14 that way on a run
      # where the native backend was working (#170). The file warms both arms,
      # runs five alternating pairs, asserts both arms return the reference
      # digest on every trial, and judges the median against the unchanged 2.5x,
      # dumping every trial into the lane log.
      - name: Verify the OS digest cost gate
        if: runner.os != 'Windows'
        working-directory: agent
        shell: bash
        run: ${{ env.DART }} test test/stt/stt_digest_cost_test.dart
      - name: Verify the OS digest cost gate
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart test test/stt/stt_digest_cost_test.dart
      # The write pipeline's cost gate owns this file so it owns a process. What
      # it asserts is a ratio — the isolate hop against the same sink in-process —
      # and a ratio measured beside another suite, or always in the same order,
      # charges one arm for the other's contention: `windows-2025` charged the
      # isolate 2.78x that way on a run where the pipeline had not regressed. The
      # file warms both arms, runs five alternating pairs, and judges the median;
      # it dumps every trial so the lane log carries the evidence, not just red.
      - name: Verify the download pipeline cost gate
        if: runner.os != 'Windows'
        working-directory: agent
        shell: bash
        run: ${{ env.DART }} test test/stt/stt_pipeline_cost_test.dart
      - name: Verify the download pipeline cost gate
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart test test/stt/stt_pipeline_cost_test.dart

  client-analyze:
    name: Analyze client
    needs: classify
    if: needs.classify.outputs.client_analyze == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Analyze client
        working-directory: client
        run: |
          fvm flutter pub get
          fvm flutter analyze

  client-tests:
    name: Test client (${{ matrix.shard }}/4)
    needs: classify
    if: needs.classify.outputs.client_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      TOTAL_SHARDS: 4
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      # The nativeapi build hook needs the GTK 3, X11, and Xi development
      # packages; the image only ships their runtime libraries. The bounded
      # action and step timeout exist because this install's `update` half once
      # hung for 19m49s and consumed the whole job budget.
      - name: Install native-asset build dependencies
        timeout-minutes: 8
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-3-dev libasound2-dev
      - name: Test client shard ${{ matrix.shard }}/4
        working-directory: client
        run: |
          set -o pipefail
          fvm flutter pub get
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(../scripts/ci/list_test_shard.sh . "$((SHARD - 1))" "$TOTAL_SHARDS")
          echo "Shard $SHARD/$TOTAL_SHARDS runs ${#files[@]} test files."
          status=0
          fvm flutter test "${files[@]}" \
            --file-reporter "json:$RUNNER_TEMP/client-tests.jsonl" || status=$?
          echo "Client shard $SHARD/$TOTAL_SHARDS ran $(../scripts/ci/test_event_counts.sh "$RUNNER_TEMP/client-tests.jsonl")."
          exit "$status"

  client-web:
    name: Web startup composition
    needs: classify
    if: needs.classify.outputs.client_web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Install native-asset build dependencies
        timeout-minutes: 8
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-3-dev libasound2-dev
      - name: Web startup composition
        working-directory: client
        run: |
          set -o pipefail
          fvm flutter pub get
          fvm flutter test --platform chrome test/web/web_startup_platform_guard_test.dart 2>&1 | tail -5

  sanad-dev-platforms:
    name: sanad-dev bootstrap (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.sanad_dev == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Verify native cross-process authentication lock
        working-directory: shared/auth_lock
        run: |
          fvm dart pub get
          fvm dart test
      - name: Verify bootstrap, journals, and terminal quoting without hosted traffic
        working-directory: scripts/sanad_dev
        run: |
          fvm dart pub get
          fvm dart test test/cli/sanad_dev_bootstrap_test.dart test/developer/sanad_dev_component_journal_test.dart test/infrastructure/sanad_dev_terminal_launcher_test.dart test/cli/sanad_dev_command_options_test.dart test/infrastructure/sanad_dev_cloud_endpoints_test.dart
      - name: Parse Windows release scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw scripts/install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/build_installer.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/release.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/stop_installed_client.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/install_staged_client.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/verify_installer.ps1))
      - name: Verify Windows running-client upgrade guard
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./client/release/windows/verify_installer.ps1 -UpgradeGuardOnly

  docs-governance:
    name: Validate docs and governance
    needs: classify
    if: needs.classify.outputs.docs_governance == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate community manifests and skills
        run: ruby scripts/community/validate_governance.rb
      - name: Validate tracked VS Code configuration
        run: |
          test "$(git ls-files '.vscode/*.json' | sort)" = $'.vscode/extensions.json\n.vscode/launch.json\n.vscode/tasks.json'
          ruby -rjson -e 'ARGV.each { |path| JSON.parse(File.read(path)) }' .vscode/*.json
          ! grep -R -E '/Users/|/Volumes/|[A-Za-z]:[/\\]' .vscode
          ruby -rjson -e 'values = JSON.parse(File.read(".vscode/tasks.json")).fetch("tasks").flat_map { |task| [task["label"], task["command"], *Array(task["args"])] }.compact; abort("ownership-sensitive VS Code task") if values.any? { |value| value.match?(/\b(?:switch|stop|restart|takeover)\b|cleanup-target-orphans/i) }'
      - name: Simulate contribution workflows
        run: |
          scripts/community/test_sync_labels.sh
          ruby scripts/community/simulate_workflows.rb

  release-security:
    name: Validate release and security boundaries
    needs: classify
    if: needs.classify.outputs.release_security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate workflow trust boundaries
        run: |
          ! grep -R "[p]ull_request_target" .github/workflows
          ! grep -R -E '[f]irebase|[g]oogle-services|[G]oogleService-Info' .github/workflows
          ! git ls-files | grep -E '\.(p12|p8|jks|keystore|mobileprovision|provisionprofile)$'
          ! git ls-files | grep -E '(^|/)dsa_priv\.pem$|(^|/)appcast(-rc)?\.xml$'
          ! grep -E 'WINDOWS_SIGNING_PFX|Prepared Authenticode|Authenticode verification' \
            .github/workflows/release.yml scripts/install.ps1 client/release/windows/release.ps1
          grep -F 'environment: release-publication' .github/workflows/release.yml
          grep -F 'validation_only:' .github/workflows/release.yml
          grep -F "if: needs.validate.outputs.validation_only != 'true'" .github/workflows/release.yml
          grep -F 'name: Create immutable Draft candidate' .github/workflows/release.yml
          grep -F 'name: Build and verify signed private IPA' .github/workflows/release.yml
          grep -F 'fvm flutter test test/tool/app_web_startup_contract_test.dart' .github/workflows/release.yml
          grep -F 'fvm flutter test --platform chrome test/web/web_startup_platform_guard_test.dart' .github/workflows/ci.yml
          grep -F 'fvm flutter test --platform chrome test/web/web_startup_platform_guard_test.dart' .github/workflows/release.yml
          grep -F 'build/web/sanad-public-sha.txt' .github/workflows/release.yml
          grep -F 'xcrun notarytool log "$submission_id"' .github/workflows/release.yml
          grep -F '.status == "Accepted"' .github/workflows/release.yml
          grep -F '.ticketContents[]' .github/workflows/release.yml
          grep -F '(.cdhash | ascii_downcase) == $cdhash' .github/workflows/release.yml
          grep -F '.arch == $arch' .github/workflows/release.yml
          grep -F 'fvm dart compile exe "-DSANAD_AGENT_VERSION=' .github/workflows/release.yml
          ! grep -F 'fvm dart compile exe `' .github/workflows/release.yml
          grep -F 'SANAD_AGENT_CODESIGN_IDENTIFIER: com.eaststarai.sanad.agent' .github/workflows/release.yml
          ! grep -E 'SANAD_AGENT_CODESIGN_IDENTIFIER: .*(\$|artifact_version)' .github/workflows/release.yml
          grep -F -- '--identifier "$SANAD_AGENT_CODESIGN_IDENTIFIER"' .github/workflows/release.yml
          grep -F 'designated_requirement="$(codesign -d -r- "$agent" 2>&1)"' .github/workflows/release.yml
          # The release matrix and the official Agent targets in the contract
          # library must move together: a target without a job publishes nothing,
          # and a job without a contract row fails manifest generation.
          ruby -ryaml -e '
            targets = YAML.load_file(".github/workflows/release.yml")
                          .dig("jobs", "agent", "strategy", "matrix", "include")
                          .map { |entry| "#{entry["platform"]}/#{entry["architecture"]}" }
                          .sort
            official = %w[linux/arm64 linux/x64 macos/arm64 macos/x64 windows/x64]
            abort("Agent release matrix drifted: #{targets.inspect}") unless targets == official
            # The pinned Flutter SDK ships no Linux arm64 archive, so that target
            # needs the pinned standalone Dart SDK and a per-lane executable.
            job = YAML.load_file(".github/workflows/release.yml").dig("jobs", "agent")
            uses = job["steps"].map { |step| step["uses"] }.compact
            abort("Linux arm64 must install the pinned standalone Dart SDK") unless uses.include?("./.github/actions/setup-dart")
            abort("The Agent matrix must select its Dart executable per lane") unless job.dig("env", "DART").to_s.include?("arm64")
          '
          grep -F 'workflow_call:' .github/workflows/deploy.yml
          grep -F 'name: Activate, verify, and roll back Production Web on failure' .github/workflows/deploy.yml
          grep -F 'https://app.sanad.eaststarai.com/sanad-public-sha.txt' .github/workflows/deploy.yml
          grep -F 'gh attestation verify download/appcast.xml' .github/workflows/deploy.yml
          grep -F 'gh attestation verify download/release-manifest.json' .github/workflows/deploy.yml
          grep -Fq "'') test \"\$RELEASE_RUN_ID\" = \"\$GITHUB_RUN_ID\" ;;" .github/workflows/deploy.yml
          test "$(grep -Fc 'scripts/release/deploy_production_asset.sh' .github/workflows/deploy.yml)" -ge 12
          test "$(grep -Fc 'if ! scripts/release/deploy_production_asset.sh activate static-' .github/workflows/deploy.yml)" -eq 3
          test "$(grep -Fc 'if ! rollback_web' .github/workflows/deploy.yml)" -eq 2
          test "$(grep -Fc 'if ! rollback_updates' .github/workflows/deploy.yml)" -eq 2
          test "$(grep -Fc 'if ! rollback_installers' .github/workflows/deploy.yml)" -eq 2
          ! grep -Eq '(^|[[:space:]])rsync[[:space:]]|ln -sfn|sudo /usr/local/sbin|/opt/sanad-sites/' .github/workflows/deploy.yml
          grep -F 'name: Activate, verify, and roll back updates on failure' .github/workflows/deploy.yml
          grep -F 'https://updates.sanad.eaststarai.com/$name' .github/workflows/deploy.yml
          grep -F 'name: Activate, verify, and roll back installer sources on failure' .github/workflows/deploy.yml
          grep -F 'https://downloads.sanad.eaststarai.com/$name' .github/workflows/deploy.yml
          grep -F 'restoring the previous selector' .github/workflows/deploy.yml
          test "$(grep -Fc 'environment: client-downloads-production' .github/workflows/deploy.yml)" -eq 3
          ! grep -Eq 'environment: (web|updates|installers)-production' .github/workflows/deploy.yml
          grep -F 'needs: updates' .github/workflows/deploy.yml
          grep -F 'needs: [updates, web]' .github/workflows/deploy.yml
          grep -F "needs.updates.result == 'success' || needs.updates.result == 'skipped'" .github/workflows/deploy.yml
          grep -F "needs.web.result == 'success' || needs.web.result == 'skipped'" .github/workflows/deploy.yml
          test "$(grep -Fc 'for attempt in $(seq 1 12); do' .github/workflows/deploy.yml)" -eq 6
          grep -F 'environment: client-downloads-production' .github/workflows/release.yml
          grep -F 'deploy_production_asset.sh deploy-client-aliases' .github/workflows/release.yml
          ! grep -Fq 'sudo /usr/local/sbin/sanad-client-downloads-control' .github/workflows/release.yml
          grep -F 'name: Deploy Stable Production assets' .github/workflows/release.yml
          grep -F 'uses: ./.github/workflows/deploy.yml' .github/workflows/release.yml
          grep -F 'release_run_id:' .github/workflows/release.yml
          grep -F 'github.run_id' .github/workflows/release.yml
          bash -n scripts/release/deploy_production_asset.sh
          grep -Fq 'broker "upload $kind' scripts/release/deploy_production_asset.sh
          grep -Fq 'upload-client-aliases' scripts/release/deploy_production_asset.sh
          scripts/release/test_generate_client_download_redirects.sh
          scripts/release/test_deploy_production_asset.sh
          scripts/release/test_verify_metadata_release_diff.sh
          grep -F -- '--draft' .github/workflows/release.yml
          grep -F 'release-manifest-rc.json' release/release-contract.json
          grep -F 'appcast-rc.xml' release/release-contract.json
          jq -e '.artifacts[] | select(.platform == "ios" and .public == false)' \
            release/release-contract.json >/dev/null
      - name: Parse PowerShell release helpers
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/release/validate_windows_clean_machine.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell release helper parsing failed."
          }
      - name: Scan committed content for credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          # The checkout holds every ref, so an unbounded scan reports findings
          # from unrelated branches and fails this change for someone else's
          # commit. Bound the range to the code under review and keep the scan
          # itself unchanged.
          zero_sha="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request|merge_group)
              if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
                log_opts="$BASE_SHA..$HEAD_SHA"
              else
                log_opts=""
              fi
              ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero_sha" ]; then
                log_opts="$PUSH_BEFORE..$PUSH_AFTER"
              else
                # A brand new branch has no previous commit: scan the ancestry of
                # the pushed commit without the other refs the checkout fetched.
                log_opts="$PUSH_AFTER"
              fi
              ;;
            workflow_dispatch)
              # A dispatched run has no comparison base, so it scans the ancestry
              # of the dispatched commit, exactly like a new-branch push, instead
              # of every ref the checkout fetched.
              log_opts="$DISPATCH_SHA"
              ;;
            *)
              log_opts=""
              ;;
          esac
          if [ -n "$log_opts" ]; then
            echo "Scanning $log_opts"
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="$log_opts"
          else
            echo "Scanning every ref"
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner
          fi

  sensitive-review:
    name: Verify protected review labels
    needs: classify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A queued merge group carries no pull-request payload. Its head ref
          # names the queued pull request, so the label check stays evidence
          # based instead of passing without review. A group that cannot be
          # attributed to exactly one pull request fails closed.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            mapfile -t queued < <(grep -oE '/pr-[0-9]+-' <<< "$MERGE_GROUP_REF" | grep -oE '[0-9]+' | sort -u)
            if (( ${#queued[@]} != 1 )); then
              echo "::error::Cannot resolve exactly one pull request from merge group ref '$MERGE_GROUP_REF'; protected review labels are unverified."
              exit 1
            fi
            PR_NUMBER="${queued[0]}"
          fi
          # Read labels at run time: a re-run keeps the original event payload,
          # so payload labels would be stale after a protected-label change.
          LABELS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.labels[].name]')"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"
          has_label() { jq -e --arg label "$1" 'index($label) != null' <<< "$LABELS_JSON" >/dev/null; }
          require_for_paths() {
            local label="$1" pattern="$2"
            if grep -Eq "$pattern" "$RUNNER_TEMP/changed" && ! has_label "$label"; then
              echo "::error::Changed paths require the protected label $label"
              return 1
            fi
          }
          require_for_paths maintainer-reviewed '^(\.github/|GOVERNANCE\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$)'
          require_for_paths security-reviewed '^(SECURITY\.md$|shared/auth_lock/|agent/lib/core/auth/|agent/lib/capabilities/permissions/)'
          if grep -Eq '^(CODE_SIGNING_POLICY\.md$|release/|client/release/|scripts/install\.(sh|ps1)$|\.github/workflows/(release|deploy|testflight)\.yml$)' "$RUNNER_TEMP/changed" &&
            ! has_label release-reviewed; then
            if scripts/release/verify_metadata_release_diff.sh "$BASE_SHA" "$HEAD_SHA"; then
              echo "Exact metadata-only release preparation does not require release-reviewed."
            else
              echo "::error::Changed paths require the protected label release-reviewed"
              exit 1
            fi
          fi

  all-required:
    name: All required checks pass
    if: always()
    needs: [classify, history, agent-checks, agent-tests, supervisor-skill, cli-automation, native-stt, client-analyze, client-tests, client-web, sanad-dev-platforms, docs-governance, release-security, sensitive-review]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CLASSIFY: ${{ needs.classify.result }}
          HISTORY: ${{ needs.history.result }}
          AGENT_CHECKS: ${{ needs.agent-checks.result }}
          AGENT_TESTS: ${{ needs.agent-tests.result }}
          SUPERVISOR_SKILL: ${{ needs.supervisor-skill.result }}
          CLI_AUTOMATION: ${{ needs.cli-automation.result }}
          NATIVE_STT: ${{ needs.native-stt.result }}
          CLIENT_ANALYZE: ${{ needs.client-analyze.result }}
          CLIENT_TESTS: ${{ needs.client-tests.result }}
          CLIENT_WEB: ${{ needs.client-web.result }}
          SANAD_DEV_PLATFORMS: ${{ needs.sanad-dev-platforms.result }}
          DOCS: ${{ needs.docs-governance.result }}
          RELEASE_SECURITY: ${{ needs.release-security.result }}
          SENSITIVE_REVIEW: ${{ needs.sensitive-review.result }}
          # What the classifier required, lane for lane, in the same order as the
          # results below: a lane it required must have succeeded, not skipped.
          REQUIRED: >-
            ${{ needs.classify.outputs.agent_checks }} ${{ needs.classify.outputs.agent_tests }}
            ${{ needs.classify.outputs.supervisor_skill }} ${{ needs.classify.outputs.cli_automation }}
            ${{ needs.classify.outputs.native_stt }} ${{ needs.classify.outputs.client_analyze }}
            ${{ needs.classify.outputs.client_tests }} ${{ needs.classify.outputs.client_web }}
            ${{ needs.classify.outputs.sanad_dev }} ${{ needs.classify.outputs.docs_governance }}
            ${{ needs.classify.outputs.release_security }}
        run: |
          set -euo pipefail
          test "$CLASSIFY" = success
          test "$HISTORY" = success
          results=("$AGENT_CHECKS" "$AGENT_TESTS" "$SUPERVISOR_SKILL" "$CLI_AUTOMATION" "$NATIVE_STT"
            "$CLIENT_ANALYZE" "$CLIENT_TESTS" "$CLIENT_WEB" "$SANAD_DEV_PLATFORMS" "$DOCS" "$RELEASE_SECURITY")
          read -r -a required <<< "$REQUIRED"
          test "${#required[@]}" -eq "${#results[@]}"
          for i in "${!results[@]}"; do
            case "${required[$i]}:${results[$i]}" in
              true:success|false:success|false:skipped) ;;
              *) echo "::error::Lane $((i + 1)) was required=${required[$i]} but ended ${results[$i]}."; exit 1 ;;
            esac
          done
          test "$SENSITIVE_REVIEW" = success
