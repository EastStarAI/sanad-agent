name: Public CI

on:
  pull_request:
    # Protected review labels are re-verified on demand through
    # protected-labels.yml, so label changes never restart full CI.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The merge queue re-runs this workflow on the queued merge commit, so the
  # aggregate check below gates the queue exactly as it gates a pull request.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-24.04
    outputs:
      agent: ${{ steps.paths.outputs.agent }}
      client: ${{ steps.paths.outputs.client }}
      docs: ${{ steps.paths.outputs.docs }}
      release: ${{ steps.paths.outputs.release }}
      security: ${{ steps.paths.outputs.security }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          classification_failed=false
          case "$EVENT_NAME" in
            pull_request|merge_group)
              if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]] ||
                ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null ||
                ! git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"; then
                classification_failed=true
                : > "$RUNNER_TEMP/changed"
              fi
              ;;
            *)
              if ! git ls-files > "$RUNNER_TEMP/changed"; then
                classification_failed=true
                : > "$RUNNER_TEMP/changed"
              fi
              ;;
          esac
          cat "$RUNNER_TEMP/changed"
          agent=false; client=false; docs=false; release=false; security=false
          # `agent/test/fixtures/cli_relay_grammar.json` is Agent-owned but the
          # Client reads it as a cross-component contract, so a change to it
          # must run the Client lanes too. Add every Agent-to-Client contract
          # fixture here; docs/operations/continuous_integration.md owns the rule.
          while IFS= read -r path; do
            case "$path" in agent/*|.agents/skills/*|shared/auth_lock/*|release/contract/*|release/release-contract.json) agent=true ;; esac
            case "$path" in client/*|shared/auth_lock/*|release/contract/*|release/release-contract.json|agent/test/fixtures/cli_relay_grammar.json) client=true ;; esac
            case "$path" in *.md|docs/*|.vscode/*|.agents/*|.github/ISSUE_TEMPLATE/*|.github/DISCUSSION_TEMPLATE/*|.github/labels.yml|.github/CODEOWNERS|.github/PULL_REQUEST_TEMPLATE.md|scripts/community/*) docs=true ;; esac
            case "$path" in .github/workflows/*|release/*|client/release/*|agent/tool/release_*.dart|scripts/release/*|scripts/install.sh|scripts/install.ps1) release=true ;; esac
            case "$path" in SECURITY.md|docs/operations/code_signing_policy.md|shared/auth_lock/*|shared/auth_lock/**/*|agent/lib/core/auth/*|agent/lib/core/auth/**/*|agent/lib/capabilities/permissions/*|agent/lib/capabilities/permissions/**/*) security=true ;; esac
          done < "$RUNNER_TEMP/changed"
          if [[ "$EVENT_NAME" != "pull_request" && "$EVENT_NAME" != "merge_group" ]] ||
            [[ "$classification_failed" == true ]] ||
            [[ "$agent$client$docs$release$security" == falsefalsefalsefalsefalse ]]; then
            echo "Classifier fallback: running every validation lane."
            agent=true; client=true; docs=true; release=true; security=true
          fi
          {
            echo "agent=$agent"
            echo "client=$client"
            echo "docs=$docs"
            echo "release=$release"
            echo "security=$security"
          } >> "$GITHUB_OUTPUT"

  history:
    name: Verify branch history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null

  agent-checks:
    name: Agent contract checks and analyze
    needs: classify
    if: needs.classify.outputs.agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Validate release contract
        working-directory: agent
        run: |
          fvm dart pub get
          fvm dart run tool/release_tool.dart validate-contract --repo-root ..
          fvm dart run tool/release_tool.dart check-preparation --repo-root ..
          version="$(jq -r '.version' ../release/release-contract.json)"
          fvm dart run tool/release_tool.dart validate-contract \
            --repo-root .. --tag "v${version}-rc.1" --channel rc
      - name: Reject mismatched release identities
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          reject() {
            if fvm dart run tool/release_tool.dart validate-contract \
              --repo-root .. "$@" >/dev/null 2>&1; then
              echo "::error::Invalid release identity was accepted: $*"
              exit 1
            fi
          }
          version="$(jq -r '.version' ../release/release-contract.json)"
          build="$(jq -r '.build_number' ../release/release-contract.json)"
          reject --tag "v${version}-beta.1" --channel rc
          reject --tag "v${version}-rc.1" --channel stable
          contract=../release/release-contract.json
          backup="$RUNNER_TEMP/release-contract.json"
          cp "$contract" "$backup"
          trap 'cp "$backup" "$contract"' EXIT
          jq --argjson b "$((build + 99))" '.build_number = $b' "$backup" > "$contract"
          reject --tag "v${version}" --channel stable
          jq '.version = "99.99.99" | .tag = "v99.99.99"' "$backup" > "$contract"
          reject --tag "v99.99.99" --channel stable
      - name: Reject an incomplete official Agent matrix
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          contract=../release/release-contract.json
          backup="$RUNNER_TEMP/release-contract-arm64.json"
          cp "$contract" "$backup"
          trap 'cp "$backup" "$contract"' EXIT
          jq '.artifacts |= map(
            select((.component == "agent" and
              .platform == "linux" and
              .architecture == "arm64") | not))' "$backup" > "$contract"
          if fvm dart run tool/release_tool.dart validate-contract \
            --repo-root .. >/dev/null 2>"$RUNNER_TEMP/arm64-rejection.log"; then
            echo "::error::A contract without the Linux arm64 Agent was accepted."
            exit 1
          fi
          grep -F 'linux/arm64' "$RUNNER_TEMP/arm64-rejection.log"
      - name: Validate embedded product skills
        working-directory: agent
        run: fvm dart run tool/generate_bundled_skills.dart --check
      - name: Validate shipped model capability defaults
        working-directory: agent
        run: fvm dart run tool/generate_model_capability_defaults.dart --check
      - name: Analyze agent
        working-directory: agent
        run: fvm dart analyze
      - name: Test CWD-sensitive suites in isolation
        working-directory: agent
        run: |
          set -o pipefail
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(../scripts/ci/list_test_shard.sh . --isolated)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No suite assigns the process working directory."
            exit 0
          fi
          fvm dart test --concurrency 1 "${files[@]}" \
            --file-reporter "json:$RUNNER_TEMP/agent-isolated.jsonl"
          echo "CWD-sensitive suites ran $(../scripts/ci/test_event_counts.sh "$RUNNER_TEMP/agent-isolated.jsonl")."

  agent-tests:
    name: Test agent (${{ matrix.shard }}/4)
    needs: classify
    if: needs.classify.outputs.agent == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      TOTAL_SHARDS: 4
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Test agent shard ${{ matrix.shard }}/4
        working-directory: agent
        run: |
          set -o pipefail
          fvm dart pub get
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(../scripts/ci/list_test_shard.sh . "$((SHARD - 1))" "$TOTAL_SHARDS")
          echo "Shard $SHARD/$TOTAL_SHARDS runs ${#files[@]} test files."
          status=0
          fvm dart test "${files[@]}" \
            --file-reporter "json:$RUNNER_TEMP/agent-tests.jsonl" || status=$?
          echo "Agent shard $SHARD/$TOTAL_SHARDS ran $(../scripts/ci/test_event_counts.sh "$RUNNER_TEMP/agent-tests.jsonl")."
          exit "$status"

  cli-automation:
    name: CLI automation (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.agent == 'true'
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm` proves the Agent compiles and answers as a native
        # arm64 executable on the same runner family the release matrix uses for
        # the official Linux arm64 artifact.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # The pinned Flutter SDK publishes no Linux arm64 archive, so the arm64
      # lane installs the standalone Dart SDK at exactly the same version.
      DART: ${{ matrix.os == 'ubuntu-24.04-arm' && 'dart' || 'fvm dart' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-dart
        if: matrix.os == 'ubuntu-24.04-arm'
      - uses: ./.github/actions/setup-fvm
        if: matrix.os != 'ubuntu-24.04-arm'
      - name: Resolve agent dependencies
        working-directory: agent
        run: ${{ env.DART }} pub get
      - name: Verify isolated CLI contracts
        working-directory: agent
        run: ${{ env.DART }} test test/guards/e2e_state_isolation_contract_test.dart
      - name: Build packaged Windows no-console launcher
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S windows/launcher -B build/windows-launcher -A x64
          cmake --build build/windows-launcher --config Release
          fvm dart compile exe bin/sanad_agent.dart -o build/windows-launcher/sanad.exe
          fvm dart run tool/package_windows_launcher.dart --agent build/windows-launcher/sanad.exe --launcher build/windows-launcher/out/sanad-launcher.exe
          & build/windows-launcher/sanad.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows Agent smoke failed.' }
      - name: Verify AOT one-shot, pipe, and JSON output
        working-directory: agent
        env:
          SANAD_CLI_AOT_SUCCESS_FILE: .dart_tool/cli-aot-smoke-success
        run: ${{ env.DART }} run tool/cli_aot_smoke.dart
      - name: Require AOT smoke success marker
        if: runner.os != 'Windows'
        working-directory: agent
        shell: bash
        run: test -f .dart_tool/cli-aot-smoke-success
      - name: Require AOT smoke success marker on Windows
        if: runner.os == 'Windows'
        working-directory: agent
        shell: pwsh
        run: |
          if (-not (Test-Path .dart_tool/cli-aot-smoke-success)) {
            throw 'AOT smoke did not complete successfully.'
          }

  client-analyze:
    name: Analyze client
    needs: classify
    if: needs.classify.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Analyze client
        working-directory: client
        run: |
          fvm flutter pub get
          fvm flutter analyze

  client-tests:
    name: Test client (${{ matrix.shard }}/4)
    needs: classify
    if: needs.classify.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      TOTAL_SHARDS: 4
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Install native-asset build dependencies
        run: |
          # The nativeapi build hook needs the GTK 3, X11, and Xi development
          # packages; the image only ships their runtime libraries.
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev libasound2-dev
      - name: Test client shard ${{ matrix.shard }}/4
        working-directory: client
        run: |
          set -o pipefail
          fvm flutter pub get
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(../scripts/ci/list_test_shard.sh . "$((SHARD - 1))" "$TOTAL_SHARDS")
          echo "Shard $SHARD/$TOTAL_SHARDS runs ${#files[@]} test files."
          status=0
          fvm flutter test "${files[@]}" \
            --file-reporter "json:$RUNNER_TEMP/client-tests.jsonl" || status=$?
          echo "Client shard $SHARD/$TOTAL_SHARDS ran $(../scripts/ci/test_event_counts.sh "$RUNNER_TEMP/client-tests.jsonl")."
          exit "$status"

  client-web:
    name: Web startup composition
    needs: classify
    if: needs.classify.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Install native-asset build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev libasound2-dev
      - name: Web startup composition
        working-directory: client
        run: |
          set -o pipefail
          fvm flutter pub get
          fvm flutter test --platform chrome test/web/web_startup_platform_guard_test.dart 2>&1 | tail -5

  sanad-dev-platforms:
    name: sanad-dev bootstrap (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.client == 'true' || needs.classify.outputs.docs == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Verify native cross-process authentication lock
        working-directory: shared/auth_lock
        run: |
          fvm dart pub get
          fvm dart test
      - name: Verify bootstrap, journals, and terminal quoting without hosted traffic
        working-directory: scripts/sanad_dev
        run: |
          fvm dart pub get
          fvm dart test test/cli/sanad_dev_bootstrap_test.dart test/developer/sanad_dev_component_journal_test.dart test/infrastructure/sanad_dev_terminal_launcher_test.dart test/cli/sanad_dev_command_options_test.dart test/infrastructure/sanad_dev_cloud_endpoints_test.dart
      - name: Parse Windows release scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw scripts/install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/build_installer.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/release.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/stop_installed_client.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/install_staged_client.ps1))
          [void][scriptblock]::Create((Get-Content -Raw client/release/windows/verify_installer.ps1))
      - name: Verify Windows running-client upgrade guard
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./client/release/windows/verify_installer.ps1 -UpgradeGuardOnly

  docs-governance:
    name: Validate docs and governance
    needs: classify
    if: needs.classify.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate community manifests and skills
        run: ruby scripts/community/validate_governance.rb
      - name: Validate tracked VS Code configuration
        run: |
          test "$(git ls-files '.vscode/*.json' | sort)" = $'.vscode/extensions.json\n.vscode/launch.json\n.vscode/tasks.json'
          ruby -rjson -e 'ARGV.each { |path| JSON.parse(File.read(path)) }' .vscode/*.json
          ! grep -R -E '/Users/|/Volumes/|[A-Za-z]:[/\\]' .vscode
          ruby -rjson -e 'values = JSON.parse(File.read(".vscode/tasks.json")).fetch("tasks").flat_map { |task| [task["label"], task["command"], *Array(task["args"])] }.compact; abort("ownership-sensitive VS Code task") if values.any? { |value| value.match?(/\b(?:switch|stop|restart|takeover)\b|cleanup-target-orphans/i) }'
      - name: Simulate contribution workflows
        run: |
          scripts/community/test_sync_labels.sh
          ruby scripts/community/simulate_workflows.rb

  release-security:
    name: Validate release and security boundaries
    needs: classify
    if: needs.classify.outputs.release == 'true' || needs.classify.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate workflow trust boundaries
        run: |
          ! grep -R "[p]ull_request_target" .github/workflows
          ! grep -R -E '[f]irebase|[g]oogle-services|[G]oogleService-Info' .github/workflows
          ! git ls-files | grep -E '\.(p12|p8|jks|keystore|mobileprovision|provisionprofile)$'
          ! git ls-files | grep -E '(^|/)dsa_priv\.pem$|(^|/)appcast(-rc)?\.xml$'
          ! grep -E 'WINDOWS_SIGNING_PFX|Prepared Authenticode|Authenticode verification' \
            .github/workflows/release.yml scripts/install.ps1 client/release/windows/release.ps1
          grep -F 'environment: release-publication' .github/workflows/release.yml
          grep -F 'validation_only:' .github/workflows/release.yml
          grep -F "if: needs.validate.outputs.validation_only != 'true'" .github/workflows/release.yml
          grep -F 'name: Create immutable Draft candidate' .github/workflows/release.yml
          grep -F 'name: Build and verify signed private IPA' .github/workflows/release.yml
          grep -F 'fvm flutter test test/tool/app_web_startup_contract_test.dart' .github/workflows/release.yml
          grep -F 'fvm flutter test --platform chrome test/web/web_startup_platform_guard_test.dart' .github/workflows/ci.yml
          grep -F 'fvm flutter test --platform chrome test/web/web_startup_platform_guard_test.dart' .github/workflows/release.yml
          grep -F 'build/web/sanad-public-sha.txt' .github/workflows/release.yml
          grep -F 'xcrun notarytool log "$submission_id"' .github/workflows/release.yml
          grep -F '.status == "Accepted"' .github/workflows/release.yml
          grep -F '.ticketContents[]' .github/workflows/release.yml
          grep -F '(.cdhash | ascii_downcase) == $cdhash' .github/workflows/release.yml
          grep -F '.arch == $arch' .github/workflows/release.yml
          grep -F 'fvm dart compile exe "-DSANAD_AGENT_VERSION=' .github/workflows/release.yml
          ! grep -F 'fvm dart compile exe `' .github/workflows/release.yml
          grep -F 'SANAD_AGENT_CODESIGN_IDENTIFIER: com.eaststarai.sanad.agent' .github/workflows/release.yml
          ! grep -E 'SANAD_AGENT_CODESIGN_IDENTIFIER: .*(\$|artifact_version)' .github/workflows/release.yml
          grep -F -- '--identifier "$SANAD_AGENT_CODESIGN_IDENTIFIER"' .github/workflows/release.yml
          grep -F 'designated_requirement="$(codesign -d -r- "$agent" 2>&1)"' .github/workflows/release.yml
          # The release matrix and the official Agent targets in the contract
          # library must move together: a target without a job publishes nothing,
          # and a job without a contract row fails manifest generation.
          ruby -ryaml -e '
            targets = YAML.load_file(".github/workflows/release.yml")
                          .dig("jobs", "agent", "strategy", "matrix", "include")
                          .map { |entry| "#{entry["platform"]}/#{entry["architecture"]}" }
                          .sort
            official = %w[linux/arm64 linux/x64 macos/arm64 macos/x64 windows/x64]
            abort("Agent release matrix drifted: #{targets.inspect}") unless targets == official
            # The pinned Flutter SDK ships no Linux arm64 archive, so that target
            # needs the pinned standalone Dart SDK and a per-lane executable.
            job = YAML.load_file(".github/workflows/release.yml").dig("jobs", "agent")
            uses = job["steps"].map { |step| step["uses"] }.compact
            abort("Linux arm64 must install the pinned standalone Dart SDK") unless uses.include?("./.github/actions/setup-dart")
            abort("The Agent matrix must select its Dart executable per lane") unless job.dig("env", "DART").to_s.include?("arm64")
          '
          grep -F 'workflow_call:' .github/workflows/deploy.yml
          grep -F 'name: Activate, verify, and roll back Production Web on failure' .github/workflows/deploy.yml
          grep -F 'https://app.sanad.eaststarai.com/sanad-public-sha.txt' .github/workflows/deploy.yml
          grep -F 'gh attestation verify download/appcast.xml' .github/workflows/deploy.yml
          grep -F 'gh attestation verify download/release-manifest.json' .github/workflows/deploy.yml
          grep -Fq "'') test \"\$RELEASE_RUN_ID\" = \"\$GITHUB_RUN_ID\" ;;" .github/workflows/deploy.yml
          test "$(grep -Fc 'scripts/release/deploy_production_asset.sh' .github/workflows/deploy.yml)" -ge 12
          test "$(grep -Fc 'if ! scripts/release/deploy_production_asset.sh activate static-' .github/workflows/deploy.yml)" -eq 3
          test "$(grep -Fc 'if ! rollback_web' .github/workflows/deploy.yml)" -eq 2
          test "$(grep -Fc 'if ! rollback_updates' .github/workflows/deploy.yml)" -eq 2
          test "$(grep -Fc 'if ! rollback_installers' .github/workflows/deploy.yml)" -eq 2
          ! grep -Eq '(^|[[:space:]])rsync[[:space:]]|ln -sfn|sudo /usr/local/sbin|/opt/sanad-sites/' .github/workflows/deploy.yml
          grep -F 'name: Activate, verify, and roll back updates on failure' .github/workflows/deploy.yml
          grep -F 'https://updates.sanad.eaststarai.com/$name' .github/workflows/deploy.yml
          grep -F 'name: Activate, verify, and roll back installer sources on failure' .github/workflows/deploy.yml
          grep -F 'https://downloads.sanad.eaststarai.com/$name' .github/workflows/deploy.yml
          grep -F 'restoring the previous selector' .github/workflows/deploy.yml
          test "$(grep -Fc 'environment: client-downloads-production' .github/workflows/deploy.yml)" -eq 3
          ! grep -Eq 'environment: (web|updates|installers)-production' .github/workflows/deploy.yml
          grep -F 'needs: updates' .github/workflows/deploy.yml
          grep -F 'needs: [updates, web]' .github/workflows/deploy.yml
          grep -F "needs.updates.result == 'success' || needs.updates.result == 'skipped'" .github/workflows/deploy.yml
          grep -F "needs.web.result == 'success' || needs.web.result == 'skipped'" .github/workflows/deploy.yml
          test "$(grep -Fc 'for attempt in $(seq 1 12); do' .github/workflows/deploy.yml)" -eq 6
          grep -F 'environment: client-downloads-production' .github/workflows/release.yml
          grep -F 'deploy_production_asset.sh deploy-client-aliases' .github/workflows/release.yml
          ! grep -Fq 'sudo /usr/local/sbin/sanad-client-downloads-control' .github/workflows/release.yml
          grep -F 'name: Deploy Stable Production assets' .github/workflows/release.yml
          grep -F 'uses: ./.github/workflows/deploy.yml' .github/workflows/release.yml
          grep -F 'release_run_id:' .github/workflows/release.yml
          grep -F 'github.run_id' .github/workflows/release.yml
          bash -n scripts/release/deploy_production_asset.sh
          grep -Fq 'broker "upload $kind' scripts/release/deploy_production_asset.sh
          grep -Fq 'upload-client-aliases' scripts/release/deploy_production_asset.sh
          scripts/release/test_generate_client_download_redirects.sh
          scripts/release/test_deploy_production_asset.sh
          scripts/release/test_verify_metadata_release_diff.sh
          grep -F -- '--draft' .github/workflows/release.yml
          grep -F 'release-manifest-rc.json' release/release-contract.json
          grep -F 'appcast-rc.xml' release/release-contract.json
          jq -e '.artifacts[] | select(.platform == "ios" and .public == false)' \
            release/release-contract.json >/dev/null
      - name: Parse PowerShell release helpers
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/release/validate_windows_clean_machine.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell release helper parsing failed."
          }
      - name: Scan committed content for credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          # The checkout holds every ref, so an unbounded scan reports findings
          # from unrelated branches and fails this change for someone else's
          # commit. Bound the range to the code under review and keep the scan
          # itself unchanged.
          zero_sha="0000000000000000000000000000000000000000"
          case "$EVENT_NAME" in
            pull_request|merge_group)
              if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
                log_opts="$BASE_SHA..$HEAD_SHA"
              else
                log_opts=""
              fi
              ;;
            push)
              if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$zero_sha" ]; then
                log_opts="$PUSH_BEFORE..$PUSH_AFTER"
              else
                # A brand new branch has no previous commit: scan the ancestry of
                # the pushed commit without the other refs the checkout fetched.
                log_opts="$PUSH_AFTER"
              fi
              ;;
            workflow_dispatch)
              # A dispatched run has no comparison base, so it scans the ancestry
              # of the dispatched commit, exactly like a new-branch push, instead
              # of every ref the checkout fetched.
              log_opts="$DISPATCH_SHA"
              ;;
            *)
              log_opts=""
              ;;
          esac
          if [ -n "$log_opts" ]; then
            echo "Scanning $log_opts"
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="$log_opts"
          else
            echo "Scanning every ref"
            "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner
          fi

  sensitive-review:
    name: Verify protected review labels
    needs: classify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A queued merge group carries no pull-request payload. Its head ref
          # names the queued pull request, so the label check stays evidence
          # based instead of passing without review. A group that cannot be
          # attributed to exactly one pull request fails closed.
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            mapfile -t queued < <(grep -oE '/pr-[0-9]+-' <<< "$MERGE_GROUP_REF" | grep -oE '[0-9]+' | sort -u)
            if (( ${#queued[@]} != 1 )); then
              echo "::error::Cannot resolve exactly one pull request from merge group ref '$MERGE_GROUP_REF'; protected review labels are unverified."
              exit 1
            fi
            PR_NUMBER="${queued[0]}"
          fi
          # Read labels at run time: a re-run keeps the original event payload,
          # so payload labels would be stale after a protected-label change.
          LABELS_JSON="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.labels[].name]')"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed"
          has_label() { jq -e --arg label "$1" 'index($label) != null' <<< "$LABELS_JSON" >/dev/null; }
          require_for_paths() {
            local label="$1" pattern="$2"
            if grep -Eq "$pattern" "$RUNNER_TEMP/changed" && ! has_label "$label"; then
              echo "::error::Changed paths require the protected label $label"
              return 1
            fi
          }
          require_for_paths maintainer-reviewed '^(\.github/|GOVERNANCE\.md$|CONTRIBUTING\.md$|CODE_OF_CONDUCT\.md$)'
          require_for_paths security-reviewed '^(SECURITY\.md$|shared/auth_lock/|agent/lib/core/auth/|agent/lib/capabilities/permissions/)'
          if grep -Eq '^(CODE_SIGNING_POLICY\.md$|release/|client/release/|scripts/install\.(sh|ps1)$|\.github/workflows/(release|deploy|testflight)\.yml$)' "$RUNNER_TEMP/changed" &&
            ! has_label release-reviewed; then
            if scripts/release/verify_metadata_release_diff.sh "$BASE_SHA" "$HEAD_SHA"; then
              echo "Exact metadata-only release preparation does not require release-reviewed."
            else
              echo "::error::Changed paths require the protected label release-reviewed"
              exit 1
            fi
          fi

  all-required:
    name: All required checks pass
    if: always()
    needs: [classify, history, agent-checks, agent-tests, cli-automation, client-analyze, client-tests, client-web, sanad-dev-platforms, docs-governance, release-security, sensitive-review]
    runs-on: ubuntu-24.04
    steps:
      - env:
          CLASSIFY: ${{ needs.classify.result }}
          HISTORY: ${{ needs.history.result }}
          AGENT_CHECKS: ${{ needs.agent-checks.result }}
          AGENT_TESTS: ${{ needs.agent-tests.result }}
          CLI_AUTOMATION: ${{ needs.cli-automation.result }}
          CLIENT_ANALYZE: ${{ needs.client-analyze.result }}
          CLIENT_TESTS: ${{ needs.client-tests.result }}
          CLIENT_WEB: ${{ needs.client-web.result }}
          SANAD_DEV_PLATFORMS: ${{ needs.sanad-dev-platforms.result }}
          DOCS: ${{ needs.docs-governance.result }}
          RELEASE_SECURITY: ${{ needs.release-security.result }}
          SENSITIVE_REVIEW: ${{ needs.sensitive-review.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY" = success
          test "$HISTORY" = success
          for result in "$AGENT_CHECKS" "$AGENT_TESTS" "$CLI_AUTOMATION" \
            "$CLIENT_ANALYZE" "$CLIENT_TESTS" "$CLIENT_WEB" \
            "$SANAD_DEV_PLATFORMS" "$DOCS" "$RELEASE_SECURITY"; do
            [[ "$result" == success || "$result" == skipped ]]
          done
          test "$SENSITIVE_REVIEW" = success
