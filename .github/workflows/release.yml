name: Prepare stable release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Intended vX.Y.Z or vX.Y.Z-rc.N identity
        type: string
        required: true
      validation_only:
        description: Build the complete private matrix without requiring a tag or creating a Draft
        type: boolean
        default: true
      request_publication:
        description: Queue protected publication after the Draft is ready
        type: boolean
        default: false

permissions:
  contents: read

# A release run is only cancellable when it cannot publish anything. A
# `validation_only` dispatch builds the matrix and stops; a newer validation makes
# the older one worthless, so it is cancelled in place. A tagged run and any
# dispatch that can reach `publish` (validation, build, signing, the private Draft
# and the protected publication environment) live in a separate group and are
# never cancelled: they are serialized, and a newer run waits instead of
# destroying in-flight signing or publication work.
concurrency:
  group: >-
    release-candidate-${{ github.event_name == 'workflow_dispatch' && inputs.validation_only == true && inputs.request_publication != true && format('validation-{0}', github.ref) || format('protected-{0}', github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only == true && inputs.request_publication != true }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_ARTIFACT_RETENTION_DAYS: 14
  # One signing identifier for every released Agent executable. It must never
  # carry the release version or the architecture: macOS stores a signed code
  # requirement in the Keychain ACL of every item the Agent creates, so a
  # versioned identifier would turn each upgrade into a different application
  # and re-prompt (or hang) on vault access.
  SANAD_AGENT_CODESIGN_IDENTIFIER: com.eaststarai.sanad.agent

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The release gate reads the `macOS full suite` runs for this commit.
      actions: read
    outputs:
      version: ${{ steps.contract.outputs.version }}
      artifact_version: ${{ steps.contract.outputs.artifact_version }}
      build: ${{ steps.contract.outputs.build }}
      tag: ${{ steps.contract.outputs.tag }}
      channel: ${{ steps.contract.outputs.channel }}
      manifest: ${{ steps.contract.outputs.manifest }}
      appcast: ${{ steps.contract.outputs.appcast }}
      prerelease: ${{ steps.contract.outputs.prerelease }}
      validation_only: ${{ steps.contract.outputs.validation_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-fvm
      - id: contract
        working-directory: agent
        shell: bash
        run: |
          set -euo pipefail
          fvm flutter pub get
          version="$(jq -r '.version' ../release/release-contract.json)"
          build="$(jq -r '.build_number' ../release/release-contract.json)"
          tag="${GITHUB_REF_NAME}"
          validation_only=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tag="${{ inputs.release_tag }}"
            if [[ "${{ inputs.validation_only }}" == true ]]; then
              test "$GITHUB_REF" = refs/heads/main
              test "${{ inputs.request_publication }}" != true
              validation_only=true
            fi
          fi
          if [[ "$tag" == "v$version" ]]; then
            channel=stable
            manifest=release-manifest.json
            appcast=appcast.xml
            prerelease=false
          else
            channel=rc
            manifest=release-manifest-rc.json
            appcast=appcast-rc.xml
            prerelease=true
          fi
          fvm dart run tool/release_tool.dart validate-contract \
            --repo-root .. --tag "$tag" --channel "$channel"
          if [[ "$validation_only" != true ]]; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          {
            echo "version=$version"
            echo "artifact_version=${tag#v}"
            echo "build=$build"
            echo "tag=$tag"
            echo "channel=$channel"
            echo "manifest=$manifest"
            echo "appcast=$appcast"
            echo "prerelease=$prerelease"
            echo "validation_only=$validation_only"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse an existing immutable or Draft release
        if: steps.contract.outputs.validation_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.contract.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release already exists; published and Draft releases are immutable candidates." >&2
            exit 1
          fi
      # The release boundary must prove macOS, not inherit it. PR385 moved the
      # complete Agent suite off the release path onto `macOS full suite`, which
      # runs on every push to `main`, is deliberately not a required check, and
      # cancels superseded runs. So a red, cancelled, or never-started suite
      # blocked nothing, and "the release is green" only ever proved the macOS
      # platform subset. This gate closes that hole: publication requires a
      # successful run of that workflow on this exact commit.
      #
      # `draft` and `publish` both need this job, so a failure here stops the
      # release before any artifact is built. A `validation_only` run publishes
      # nothing, so for it the same evidence is reported and not enforced - that
      # is the one path where a missing suite is a warning.
      - name: Require a green macOS full suite on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          VALIDATION_ONLY: ${{ steps.contract.outputs.validation_only }}
        run: |
          set -euo pipefail
          runs_url="repos/$GITHUB_REPOSITORY/actions/workflows/macos-full-suite.yml/runs?head_sha=$HEAD_SHA&per_page=100"
          # An unreadable API and a reply that is not a run list are the same
          # missing evidence: reported for validation_only, refused otherwise.
          if ! runs_json="$(gh api "$runs_url" 2>"$RUNNER_TEMP/macos-suite.err")" ||
            ! jq -e '.workflow_runs | type == "array"' >/dev/null 2>>"$RUNNER_TEMP/macos-suite.err" <<< "$runs_json"; then
            cat "$RUNNER_TEMP/macos-suite.err" >&2 || true
            if [[ "$VALIDATION_ONLY" == true ]]; then
              echo "::warning::Could not read the macOS full suite runs for $HEAD_SHA; a validation_only run reports this instead of failing."
              exit 0
            fi
            echo "::error::Could not read the macOS full suite runs for $HEAD_SHA; refusing to publish on unproven macOS coverage."
            exit 1
          fi
          # Any successful run on this exact commit is the evidence, even when a
          # later run on the same commit was cancelled by a newer push: cancelling
          # a `main` run only removes a duplicate, it does not un-prove the commit.
          green="$(jq -r --arg sha "$HEAD_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")]
            | sort_by(.created_at) | reverse | (.[0].html_url // empty)' <<< "$runs_json")"
          if [[ -n "$green" ]]; then
            echo "macOS full suite is green on $HEAD_SHA: $green"
            exit 0
          fi
          read -r status conclusion url event <<< "$(jq -r --arg sha "$HEAD_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha)]
            | sort_by(.created_at) | reverse | (.[0] // {})
            | "\(.status // "missing") \(.conclusion // "none") \(.html_url // "none") \(.event // "none")"' <<< "$runs_json")"
          if [[ "$status" == missing ]]; then
            reason="no macOS full suite run exists for $HEAD_SHA"
          elif [[ "$status" != completed ]]; then
            reason="the macOS full suite run for $HEAD_SHA is still $status ($event, $url)"
          else
            reason="the newest macOS full suite run for $HEAD_SHA concluded $conclusion ($event, $url)"
          fi
          if [[ "$VALIDATION_ONLY" == true ]]; then
            echo "::warning::macOS full suite evidence is not satisfied: $reason. This run publishes nothing, so it is reported and not enforced."
            exit 0
          fi
          {
            echo "::error::Refusing to release: $reason."
            echo "Wait for a green macOS full suite run on this exact commit, then re-run this workflow."
          }
          exit 1

  agent:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: macos
            architecture: arm64
            extension: ''
            environment: apple-signing
          - runner: macos-15-intel
            platform: macos
            architecture: x64
            extension: ''
            environment: apple-signing
          - runner: ubuntu-24.04
            platform: linux
            architecture: x64
            extension: ''
            environment: release-build
          # GitHub-hosted arm64 runner. Linux carries SHA-256 plus GitHub
          # attestation and no platform code signature, so arm64 uses the same
          # trust policy, Environment, and gates as Linux x64; the public
          # installer resolves the Agent by platform plus architecture and never
          # substitutes another target.
          - runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            extension: ''
            environment: release-build
          - runner: windows-2025
            platform: windows
            architecture: x64
            extension: .exe
            environment: release-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    environment: ${{ matrix.environment }}
    env:
      # The pinned Flutter SDK publishes no Linux arm64 archive, so that job
      # installs the standalone Dart SDK at exactly the same version instead.
      # Every other job keeps the FVM-managed Flutter SDK.
      DART: ${{ matrix.platform == 'linux' && matrix.architecture == 'arm64' && 'dart' || 'fvm dart' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-dart
        if: matrix.platform == 'linux' && matrix.architecture == 'arm64'
      - uses: ./.github/actions/setup-fvm
        if: matrix.platform != 'linux' || matrix.architecture != 'arm64'
      - name: Select the whisper-only dictation engine
        if: matrix.platform == 'linux' && matrix.architecture == 'arm64'
        working-directory: agent
        shell: bash
        # `sherpa_onnx` requires the Flutter SDK, and this lane installs the
        # standalone Dart SDK. The overlay swaps the engine for a stand-in with
        # the same package name, so the arm64 Agent is a complete build: whisper
        # batch dictation, no streaming or VAD.
        run: cp tool/pubspec_overrides.no_sherpa.yaml pubspec_overrides.yaml
      - name: Fetch whisper.cpp
        uses: actions/checkout@v6
        with:
          repository: ggerganov/whisper.cpp
          ref: v1.9.5
          path: whisper.cpp
      - name: Cache whisper build
        uses: actions/cache@v4
        with:
          path: whisper.cpp/build
          # `v4` because the libraries are linked with an `$ORIGIN` install rpath
          # and ggml is configured `GGML_NATIVE=OFF`; see `.github/workflows/ci.yml`
          # for why a tree restored under an older key must not be reused.
          key: whisper-build-v4-${{ matrix.runner }}-whispercpp-v1.9.5-${{ hashFiles('agent/native/whispercpp/sanad_whisper.c') }}
      - name: Require the runner CPU the matrix label claims
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ matrix.architecture }}"
          if [ "$expected" = "x64" ]; then expected=x86_64; fi
          actual="$(uname -m)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::${{ matrix.runner }} reported $actual, expected $expected"
            exit 1
          fi
      - name: Set up MSVC
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies and check generated sources
        if: matrix.platform != 'windows'
        working-directory: agent
        shell: bash
        run: |
          ${{ env.DART }} pub get
          ${{ env.DART }} run tool/generate_bundled_skills.dart --check
          ${{ env.DART }} run tool/generate_model_capability_defaults.dart --check
          ${{ env.DART }} analyze
      # The full suite runs on Linux only. Public CI already executes all 381
      # agent test files on four Ubuntu shards for every pull request and merge,
      # and `.github/workflows/macos-full-suite.yml` proves the same suite on both
      # macOS architectures on every push to `main`. A macOS release lane instead
      # re-proves the platform-sensitive subset that a Linux lane cannot
      # (`scripts/ci/list_test_shard.sh --platform-macos`), which is the one
      # source of truth for that selection.
      - name: Test the whole agent suite
        if: matrix.platform == 'linux'
        working-directory: agent
        shell: bash
        run: ${{ env.DART }} test
      - name: Test the macOS platform subset
        if: matrix.platform == 'macos'
        working-directory: agent
        shell: bash
        run: |
          set -o pipefail
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(../scripts/ci/list_test_shard.sh . --platform-macos)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "The macOS platform subset is empty; refusing to prove nothing."
            exit 1
          fi
          echo "macOS platform subset runs ${#files[@]} test files."
          ${{ env.DART }} test "${files[@]}"
      - name: Test the CWD-sensitive suites alone
        if: matrix.platform == 'macos'
        working-directory: agent
        shell: bash
        run: |
          set -o pipefail
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(../scripts/ci/list_test_shard.sh . --isolated)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No suite assigns the process working directory."
            exit 0
          fi
          ${{ env.DART }} test --concurrency 1 "${files[@]}"
      - name: Analyze the dictation engine package
        if: matrix.platform != 'windows'
        working-directory: agent
        shell: bash
        # The engine is a swappable local package excluded from the package-wide
        # analysis (only one of the two can resolve), so the lane that selected it
        # analyzes it explicitly.
        run: |
          set -euo pipefail
          engine=packages/stt_sherpa
          if [ -f pubspec_overrides.yaml ]; then engine=packages/stt_sherpa_stub; fi
          ${{ env.DART }} analyze "$engine"
      - name: Compile agent
        if: matrix.platform != 'windows'
        working-directory: agent
        shell: bash
        run: |
          mkdir -p ../dist
          ${{ env.DART }} compile exe \
            -DSANAD_AGENT_VERSION=${{ needs.validate.outputs.version }} \
            bin/sanad_agent.dart \
            -o "../dist/sanad-agent-${{ needs.validate.outputs.artifact_version }}-${{ matrix.platform }}-${{ matrix.architecture }}${{ matrix.extension }}"
      - name: Validate Windows release surface
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm flutter pub get
          fvm dart run tool/generate_bundled_skills.dart --check
          fvm dart run tool/generate_model_capability_defaults.dart --check
          fvm dart analyze
          fvm dart test test/core/update/release_manifest_test.dart
          $engine = 'packages/stt_sherpa'
          if (Test-Path pubspec_overrides.yaml) { $engine = 'packages/stt_sherpa_stub' }
          fvm dart analyze $engine
      - name: Compile Windows agent and no-console launcher
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path ../dist -Force | Out-Null
          cmake -S windows/launcher -B build/windows-launcher -A x64
          cmake --build build/windows-launcher --config Release
          fvm dart compile exe "-DSANAD_AGENT_VERSION=${{ needs.validate.outputs.version }}" bin/sanad_agent.dart -o "../dist/sanad-agent-${{ needs.validate.outputs.artifact_version }}-windows-x64.exe"
          fvm dart run tool/package_windows_launcher.dart --agent "../dist/sanad-agent-${{ needs.validate.outputs.artifact_version }}-windows-x64.exe" --launcher "build/windows-launcher/out/sanad-launcher.exe"
      # `--verify` disassembles the staged libraries and fails on any
      # instruction above the declared baseline. Installing the disassembler
      # when it is absent keeps the gate from skipping on the lane that
      # actually ships the payload; the bounded action makes a stalled mirror a
      # fast failure instead of a lost release lane.
      - name: Install the disassembler the instruction-set guard needs
        if: matrix.platform == 'linux'
        timeout-minutes: 8
        uses: ./.github/actions/apt-install
        with:
          packages: binutils
          options: ''
          skip-if-command: objdump
      - name: Report the disassembler
        if: matrix.platform == 'linux'
        run: objdump --version | head -1
      # Audit D9: the packaged Agent must carry the native dictation runtime
      # beside its executable. It is built in the same matrix entry as the
      # executable, so one platform's payload cannot silently receive another
      # platform's libraries, and a failed build fails the release. Every
      # Windows step in this job stays PowerShell: the runner's fvm entry point
      # is a `.bat` shim and this lane has no verified Git-Bash semantics.
      - name: Build and verify the native dictation runtime
        if: matrix.platform != 'windows'
        working-directory: agent
        shell: bash
        env:
          WHISPER_CPP_SRC: ${{ github.workspace }}/whisper.cpp
          EXPECTED: ${{ matrix.platform }}-${{ matrix.architecture }}
          # This lane ships the payload, so a guard that cannot run is a defect
          # rather than a skip.
          SANAD_STT_REQUIRE_NATIVE: '1'
        run: |
          set -euo pipefail
          ${{ env.DART }} run tool/ensure_native_stt.dart --expect-target "$EXPECTED"
          ${{ env.DART }} run tool/ensure_native_stt.dart --verify --expect-target "$EXPECTED"
      - name: Build and verify the native dictation runtime
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        env:
          WHISPER_CPP_SRC: ${{ github.workspace }}/whisper.cpp
          EXPECTED: ${{ matrix.platform }}-${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart run tool/ensure_native_stt.dart --expect-target $env:EXPECTED
          fvm dart run tool/ensure_native_stt.dart --verify --expect-target $env:EXPECTED
      - name: Smoke-test embedded skills on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $agent = "dist/sanad-agent-${{ needs.validate.outputs.artifact_version }}-windows-x64.exe"
          $sanadHome = Join-Path $env:RUNNER_TEMP "sanad-bundled-skills-home"
          if (Test-Path $sanadHome) { Remove-Item -Recurse -Force $sanadHome }
          $env:SANAD_HOME = $sanadHome
          # `version` is a pure query and answers before Home preparation, so it
          # proves nothing about the embedded skills and must create nothing.
          & $agent version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Agent version probe failed." }
          if (Test-Path $sanadHome) {
            throw "version created a Sanad Home; pure queries must stay side-effect free."
          }
          # `skills list` is read-only but not pure: it runs Home bootstrap and
          # the bundled-skill reconcile, then lists. It starts no daemon and
          # opens no network connection.
          & $agent skills list --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Bundled skill smoke failed." }
          @(
            "skills/skill-creator/SKILL.md",
            "skills/skill-creator/references/schemas.md",
            "skills/find-skills/LICENSE.txt",
            "skills/agent-browser/LICENSE.txt"
          ) | ForEach-Object {
            if (-not (Test-Path (Join-Path $sanadHome $_) -PathType Leaf)) {
              throw "Missing extracted bundled skill file: $_"
            }
          }
          # A gateway command must reach the gateway without opening the Agent
          # vault. Windows DPAPI never prompts, so this guards the classification
          # rather than a hang: a gateway command must leave no vault artifact in
          # a Home that owns no secrets, and must finish.
          $gatewayHome = Join-Path $env:RUNNER_TEMP "sanad-gateway-smoke-home"
          if (Test-Path $gatewayHome) { Remove-Item -Recurse -Force $gatewayHome }
          New-Item -ItemType Directory -Path $gatewayHome -Force | Out-Null
          Set-Content -Path (Join-Path $gatewayHome ".local_token") -Value "release-smoke-token" -NoNewline
          $env:SANAD_HOME = $gatewayHome
          $gatewayLog = Join-Path $env:RUNNER_TEMP "sanad-gateway-smoke.log"
          $gatewayProcess = Start-Process -FilePath (Resolve-Path $agent).Path `
            -ArgumentList "session", "list", "--json" -PassThru -NoNewWindow `
            -RedirectStandardOutput $gatewayLog -RedirectStandardError "$gatewayLog.err"
          if (-not $gatewayProcess.WaitForExit(60000)) {
            Stop-Process -Id $gatewayProcess.Id -Force
            throw "session list did not finish; a gateway command must never block."
          }
          Get-Content $gatewayLog, "$gatewayLog.err" -ErrorAction SilentlyContinue | Write-Host
          if (Get-ChildItem -Path $gatewayHome -Filter "secret_vault*" -ErrorAction SilentlyContinue) {
            throw "session list opened the Agent vault; a gateway command must never require an OS credential prompt."
          }
      - name: Import Apple Developer ID
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$APPLE_KEY_BASE64"
          keychain="$RUNNER_TEMP/sanad-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" |
            sed -n 's/.*"\(Developer ID Application: NanoSoft LY LLC ([^"]*)\)".*/\1/p' |
            head -n 1)"
          test -n "$identity"
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          agent="dist/sanad-agent-${{ needs.validate.outputs.artifact_version }}-${{ matrix.platform }}-${{ matrix.architecture }}${{ matrix.extension }}"
          codesign --force --options runtime --timestamp \
            --identifier "$SANAD_AGENT_CODESIGN_IDENTIFIER" \
            --entitlements .github/release/macos_agent.entitlements \
            --sign "$identity" \
            "$agent"
          codesign --verify --strict --verbose=2 "$agent"
          # The identifier is part of the designated requirement, and macOS
          # records that requirement as the trusted application of the Keychain
          # items the Agent creates. Prove the artifact carries the stable
          # identifier and NanoSoft team requirement before notarization.
          signed_identifier="$(codesign -d --verbose=2 "$agent" 2>&1 |
            sed -n 's/^Identifier=//p' | head -n 1)"
          test "$signed_identifier" = "$SANAD_AGENT_CODESIGN_IDENTIFIER"
          designated_requirement="$(codesign -d -r- "$agent" 2>&1)"
          printf '%s\n' "$designated_requirement" |
            grep -F "identifier \"$SANAD_AGENT_CODESIGN_IDENTIFIER\"" >/dev/null
          printf '%s\n' "$designated_requirement" |
            grep -E 'certificate leaf\[subject\.OU\] = "?UC2824B99G"?' >/dev/null
          "$agent" version | grep -F "Version: ${{ needs.validate.outputs.version }}"
      # Hardened runtime enables library validation, so a staged dylib that is
      # not signed by this team would be refused even when it is present. Sign
      # the libraries with the same identity as the Agent instead of weakening
      # the Agent with the disable-library-validation entitlement.
      - name: Sign the native dictation runtime
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MACOS_SIGNING_IDENTITY"
          expected_arch="${{ matrix.architecture }}"
          if [ "$expected_arch" = "x64" ]; then expected_arch=x86_64; fi
          directory="agent/native/${{ matrix.platform }}-${{ matrix.architecture }}"
          count=0
          while IFS= read -r -d '' library; do
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$library"
            codesign --verify --strict --verbose=2 "$library"
            count=$((count + 1))
          done < <(find "$directory" -type f -name '*.dylib' -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::no staged native libraries were signed"
            exit 1
          fi
          # Signing must not change the slice the loader will accept.
          lipo -archs "$directory/libsanad_whisper.dylib" | grep -F "$expected_arch" >/dev/null
      - name: Stage and archive the native dictation runtime
        if: matrix.platform != 'windows'
        working-directory: agent
        shell: bash
        env:
          EXPECTED: ${{ matrix.platform }}-${{ matrix.architecture }}
          ARCHIVE_NAME: sanad-agent-runtime-${{ needs.validate.outputs.artifact_version }}-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
        run: |
          set -euo pipefail
          ${{ env.DART }} run tool/ensure_native_stt.dart --verify \
            --expect-target "$EXPECTED" \
            --stage ../dist \
            --archive ../dist \
            --archive-name "$ARCHIVE_NAME"
          test -f "../dist/$ARCHIVE_NAME"
      - name: Stage and archive the native dictation runtime
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        env:
          EXPECTED: ${{ matrix.platform }}-${{ matrix.architecture }}
          ARCHIVE_NAME: sanad-agent-runtime-${{ needs.validate.outputs.artifact_version }}-${{ matrix.platform }}-${{ matrix.architecture }}.tar.gz
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart run tool/ensure_native_stt.dart --verify `
            --expect-target $env:EXPECTED `
            --stage ../dist `
            --archive ../dist `
            --archive-name $env:ARCHIVE_NAME
          if (-not (Test-Path -LiteralPath (Join-Path ../dist $env:ARCHIVE_NAME))) {
            throw "The staged runtime archive is missing."
          }
      # The staged layout is enforced by `stageSttRuntime` and covered by
      # agent/test/tool/stt_native_runtime_test.dart; the archive member naming
      # by agent/test/tool/native_runtime_package_contract_test.dart. This step
      # stays one command per shell instead of find/tar pipelines the guard
      # cannot see.
      - name: Load the packaged runtime in a real process
        if: matrix.platform != 'windows'
        working-directory: agent
        shell: bash
        # Required only here: the full suite above runs before the runtime is
        # built, so the flag belongs on this step rather than on the job.
        env:
          SANAD_STT_REQUIRE_NATIVE: '1'
        run: ${{ env.DART }} test test/stt/native_runtime_smoke_test.dart
      - name: Load the packaged sherpa runtime in a real process
        if: matrix.platform != 'windows'
        working-directory: agent
        shell: bash
        # The engine ships inside the archive this job just staged, so the smoke
        # proves the packaged layout, not the pub cache a developer has. The
        # linux-arm64 lane links the whisper-only stand-in and asserts that
        # instead.
        env:
          SANAD_SHERPA_REQUIRE_NATIVE: '1'
          SANAD_STT_RUNTIME_DIR: ${{ github.workspace }}/dist/native/${{ matrix.platform }}-${{ matrix.architecture }}/sherpa
        run: ${{ env.DART }} test test/stt/sherpa_runtime_smoke_test.dart
      - name: Load the packaged sherpa runtime in a real process
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        env:
          SANAD_SHERPA_REQUIRE_NATIVE: '1'
          SANAD_STT_RUNTIME_DIR: ${{ github.workspace }}/dist/native/${{ matrix.platform }}-${{ matrix.architecture }}/sherpa
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart test test/stt/sherpa_runtime_smoke_test.dart
      - name: Load the packaged runtime in a real process
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        env:
          SANAD_STT_REQUIRE_NATIVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm dart test test/stt/native_runtime_smoke_test.dart
      - name: Notarize macOS agent
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          agent="dist/sanad-agent-${{ needs.validate.outputs.artifact_version }}-${{ matrix.platform }}-${{ matrix.architecture }}"
          archive="$RUNNER_TEMP/sanad-agent-notarization.zip"
          ditto -c -k --keepParent "$agent" "$archive"
          submission_result="$RUNNER_TEMP/notary-submission.json"
          notary_log="$RUNNER_TEMP/notary-log.json"
          xcrun notarytool submit "$archive" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --output-format json > "$submission_result"
          submission_id="$(jq -r '.id // empty' "$submission_result")"
          test -n "$submission_id"
          jq -e '.status == "Accepted"' "$submission_result" >/dev/null
          log_fetched=false
          for attempt in {1..12}; do
            if xcrun notarytool log "$submission_id" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" \
              "$notary_log"; then
              log_fetched=true
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              echo "Accepted notarization log is not queryable yet; retrying ($attempt/12)."
              sleep 10
            fi
          done
          test "$log_fetched" = true
          binary_cdhash="$(codesign -d --verbose=4 "$agent" 2>&1 |
            sed -n 's/^CDHash=//p' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          binary_arch="$(lipo -archs "$agent")"
          test -n "$binary_cdhash"
          test -n "$binary_arch"
          jq -e --arg cdhash "$binary_cdhash" --arg arch "$binary_arch" '
            .status == "Accepted" and
            .statusCode == 0 and
            (.issues == null or .issues == []) and
            any(.ticketContents[];
              (.cdhash | ascii_downcase) == $cdhash and
              .arch == $arch and
              .digestAlgorithm == "SHA-256")
          ' "$notary_log" >/dev/null
      # The smoke runs on the shipped binary: after codesign and notarization, so
      # it also proves the signed, notarized executable is the one that answers
      # pure queries, extracts bundled skills, and reaches a gateway command
      # without opening the OS credential vault.
      - name: Smoke-test the shipped agent binary
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          agent="dist/sanad-agent-${{ needs.validate.outputs.artifact_version }}-${{ matrix.platform }}-${{ matrix.architecture }}${{ matrix.extension }}"
          home="$RUNNER_TEMP/sanad-bundled-skills-home"
          rm -rf "$home"
          # `version` is a pure query and answers before Home preparation, so it
          # proves nothing about the embedded skills and must create nothing.
          SANAD_HOME="$home" "$agent" version >/dev/null
          if [ -e "$home" ]; then
            echo "version created a Sanad Home; pure queries must stay side-effect free." >&2
            exit 1
          fi
          # `skills list` is read-only but not pure: it runs Home bootstrap and
          # the bundled-skill reconcile, then lists. It starts no daemon and
          # opens no network connection.
          SANAD_HOME="$home" "$agent" skills list --json >/dev/null
          test -f "$home/skills/skill-creator/SKILL.md"
          test -f "$home/skills/skill-creator/references/schemas.md"
          test -f "$home/skills/find-skills/LICENSE.txt"
          test -f "$home/skills/agent-browser/LICENSE.txt"
          # A gateway command must reach the gateway without opening the Agent
          # vault: opening the OS credential vault can make the shipped binary
          # wait in an authorization dialog nobody answers, with no output and
          # no socket. With no daemon present `session list` reports a connection
          # error, which is fine; not finishing, or leaving a vault artifact in
          # a Home that owns no secrets, is not.
          gateway_home="$RUNNER_TEMP/sanad-gateway-smoke-home"
          rm -rf "$gateway_home"
          mkdir -p "$gateway_home"
          printf 'release-smoke-token' > "$gateway_home/.local_token"
          set +e
          perl -e 'alarm 60; exec @ARGV' env SANAD_HOME="$gateway_home" "$agent" session list --json >/dev/null 2>&1
          gateway_status=$?
          set -e
          if [ "$gateway_status" -ge 128 ]; then
            echo "session list did not finish (status $gateway_status); a gateway command must never block." >&2
            exit 1
          fi
          if ls "$gateway_home"/secret_vault* >/dev/null 2>&1; then
            echo "session list opened the Agent vault; a gateway command must never require an OS credential prompt." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-linux-web:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Install Linux build dependencies
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          packages: clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev xvfb
          options: ''
      - name: Build Linux and Web
        working-directory: client
        run: |
          set -euo pipefail
          fvm flutter pub get
          fvm flutter analyze
          fvm flutter test test/tool/app_web_startup_contract_test.dart
          fvm flutter test test/tool/linux_release_compatibility_contract_test.dart
          fvm flutter test --platform chrome test/web/web_startup_platform_guard_test.dart 2>&1 | tail -5
          fvm flutter build linux --release --dart-define-from-file=config/prod.json
          fvm flutter build web --release --dart-define-from-file=config/prod.json
          printf '%s\n' '{"version":"${{ needs.validate.outputs.artifact_version }}","build":${{ needs.validate.outputs.build }}}' \
            > build/web/version.json
          git rev-parse HEAD > build/web/sanad-public-sha.txt
          test -s build/web/index.html
          grep -Fq 'flutter_bootstrap.js' build/web/index.html
          test -s build/web/flutter_bootstrap.js
          test -s build/web/favicon.svg
          jq -e \
            --arg version '${{ needs.validate.outputs.artifact_version }}' \
            --argjson build '${{ needs.validate.outputs.build }}' \
            '.version == $version and .build == $build' \
            build/web/version.json >/dev/null
          test "$(cat build/web/sanad-public-sha.txt)" = "$GITHUB_SHA"
          find build/web -type d -exec chmod 755 {} +
          find build/web -type f -exec chmod 644 {} +
          test -z "$(find build/web -type f ! -perm -004 -print -quit)"
          mkdir -p ../dist
          tar -C build/linux/x64/release -czf \
            "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-linux-x64.tar.gz" bundle
          bash ../scripts/release/test_linux_release_bundle.sh \
            "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-linux-x64.tar.gz"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")" \
            bash release/linux/build_linux_deb.sh \
            build/linux/x64/release/bundle \
            "${{ needs.validate.outputs.artifact_version }}" \
            "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-linux-x64.deb"
          bash ../scripts/release/test_linux_deb_package.sh \
            "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-linux-x64.deb" \
            --install
          tar -C build/web -czf \
            "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-web-universal.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: client-linux-web
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-android:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-signing
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Restore Android signing material
        working-directory: client
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sanad-release.jks"
          chmod 600 "$RUNNER_TEMP/sanad-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/sanad-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          chmod 600 android/key.properties
      - name: Build signed Android artifacts
        working-directory: client
        run: |
          fvm flutter pub get
          fvm flutter build apk --release --dart-define-from-file=config/prod.json
          fvm flutter build appbundle --release --dart-define-from-file=config/prod.json
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-android-universal.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-android-universal.aab"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" \
            verify --verbose "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-android-universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-macos:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-signing
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Restore Apple and Sparkle signing material
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SPARKLE_KEY_BASE64: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY_BASE64 }}
          APPLE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          keychain="$RUNNER_TEMP/sanad-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$SPARKLE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$APPLE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/sparkle-private-key" \
            "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"
      - name: Build signed and notarized DMG
        working-directory: client
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          SPARKLE_ED25519_PRIVATE_KEY_PATH: ${{ runner.temp }}/sparkle-private-key
        run: |
          brew install create-dmg
          fvm flutter pub get
          fvm flutter precache --macos
          (cd macos && pod install)
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH" || true
          release/macos/release_macos.sh
          mkdir -p ../dist
          source_prefix="build/sanad-client-${{ needs.validate.outputs.version }}-macos-universal.dmg"
          target_prefix="../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-macos-universal.dmg"
          for source in "$source_prefix"*; do
            suffix="${source#$source_prefix}"
            cp "$source" "$target_prefix$suffix"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-windows:
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 60
    environment: windows-update-signing
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Install pinned NSIS compiler
        shell: pwsh
        run: |
          $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12-setup.exe"
          $expectedSha256 = "3bc2b06253a7e4957111be152ac6a536e0c7478a706e19da814038db5d706495"
          $expectedSize = 1566914
          $installer = Join-Path $env:RUNNER_TEMP "nsis-installer.exe"
          curl.exe --fail --location --retry 3 --proto "=https" --tlsv1.2 `
            --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Pinned NSIS download failed." }
          $actualSize = (Get-Item -LiteralPath $installer).Length
          if ($actualSize -ne $expectedSize) {
            throw "Pinned NSIS installer size verification failed."
          }
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Pinned NSIS installer SHA-256 verification failed."
          }
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Pinned NSIS installer failed." }
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { throw "Pinned NSIS compiler is missing." }
          Split-Path $makensis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Restore WinSparkle update-signing material
        shell: pwsh
        env:
          DSA_KEY_BASE64: ${{ secrets.WINSPARKLE_DSA_PRIVATE_KEY_BASE64 }}
        run: |
          if (-not $env:DSA_KEY_BASE64) {
            throw "WinSparkle DSA update-signing key is required."
          }
          $dsaKey = Join-Path $env:RUNNER_TEMP "dsa_priv.pem"
          [IO.File]::WriteAllBytes($dsaKey, [Convert]::FromBase64String($env:DSA_KEY_BASE64))
          "WINSPARKLE_PRIVATE_KEY_PATH=$dsaKey" >> $env:GITHUB_ENV
      - name: Build unsigned Windows installer with signed updates
        working-directory: client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          fvm flutter pub get
          ./release/windows/release.ps1
          New-Item -ItemType Directory -Path ../dist -Force | Out-Null
          $sourcePrefix = "sanad-client-${{ needs.validate.outputs.version }}-windows-x64.exe"
          $targetPrefix = "sanad-client-${{ needs.validate.outputs.artifact_version }}-windows-x64.exe"
          Get-ChildItem build -Filter "$sourcePrefix*" | ForEach-Object {
            $suffix = $_.Name.Substring($sourcePrefix.Length)
            Copy-Item $_.FullName (Join-Path ../dist "$targetPrefix$suffix")
          }
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  client-ios:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-testflight
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - name: Restore Apple Distribution identity and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$PROFILE_BASE64"
          keychain="$RUNNER_TEMP/sanad-ios.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/sanad.mobileprovision"
          chmod 600 "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/sanad.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          uuid="$(security cms -D -i "$RUNNER_TEMP/sanad.mobileprovision" | \
            plutil -extract UUID raw -o - -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/sanad.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
      - name: Build and verify signed private IPA
        working-directory: client
        run: |
          set -euo pipefail
          fvm flutter pub get
          bash release/ios/build_signed_ipa.sh \
            --build-name="${{ needs.validate.outputs.version }}" \
            --build-number="${{ needs.validate.outputs.build }}" \
            --env-config=config/prod.json
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          mkdir -p ../dist
          cp "$ipa" \
            "../dist/sanad-client-${{ needs.validate.outputs.artifact_version }}-ios-universal.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: client-ios-private
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  assemble:
    needs: [validate, agent, client-linux-web, client-android, client-macos, client-windows, client-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Generate and verify release metadata
        working-directory: agent
        run: |
          fvm flutter pub get
          fvm dart run tool/release_tool.dart generate-manifest \
            --repo-root .. \
            --artifacts ../dist \
            --commit "$GITHUB_SHA" \
            --tag "${{ needs.validate.outputs.tag }}" \
            --channel "${{ needs.validate.outputs.channel }}" \
            --output "../dist/${{ needs.validate.outputs.manifest }}"
          fvm dart run tool/release_tool.dart verify-manifest \
            --manifest "../dist/${{ needs.validate.outputs.manifest }}" \
            --artifacts ../dist
          fvm dart run tool/release_tool.dart generate-appcast \
            --manifest "../dist/${{ needs.validate.outputs.manifest }}" \
            --output "../dist/${{ needs.validate.outputs.appcast }}" \
            --published-at "$(git show -s --format=%cI "$GITHUB_SHA")"
          (cd ../dist && sha256sum "${{ needs.validate.outputs.appcast }}" >> SHA256SUMS)
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/sanad-${{ needs.validate.outputs.artifact_version }}.spdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/sanad-*
            dist/release-manifest*.json
            dist/appcast*.xml
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate.outputs.channel }}-release-candidate
          path: dist/*
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error

  draft:
    name: Create immutable Draft candidate
    needs: [validate, assemble]
    if: needs.validate.outputs.validation_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: ${{ needs.validate.outputs.channel }}-release-candidate
          path: dist
      - name: Create private Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t public_assets < <(
            jq -r '.artifacts[] | "dist/" + .filename' \
              "dist/${{ needs.validate.outputs.manifest }}"
          )
          metadata=(
            "dist/${{ needs.validate.outputs.manifest }}"
            dist/SHA256SUMS
            "dist/${{ needs.validate.outputs.appcast }}"
            dist/sanad-${{ needs.validate.outputs.artifact_version }}.spdx.json
          )
          prerelease=()
          if [[ "${{ needs.validate.outputs.prerelease }}" == true ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${{ needs.validate.outputs.tag }}" \
            "${public_assets[@]}" "${metadata[@]}" \
            --verify-tag \
            --draft \
            "${prerelease[@]}" \
            --title "Sanad ${{ needs.validate.outputs.tag }}" \
            --notes-file release/release-notes.md

  publish:
    name: Publish approved immutable release
    needs: [validate, draft]
    if: needs.validate.outputs.validation_only != 'true' && (github.ref_type == 'tag' || inputs.request_publication == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-publication
    permissions:
      contents: write
    steps:
      - name: Atomically publish the reviewed Draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Draft releases are NOT returned by the tags endpoint; list and filter instead.
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft == true) | .id")"
          if [[ -z "$release_id" ]]; then
            echo "::error::No draft release found for tag $RELEASE_TAG"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
            --jq '{draft, prerelease, tag_name}' >&2
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/$release_id" \
            -F draft=false \
            -F prerelease="$EXPECTED_PRERELEASE" \
            --silent

  client-download-aliases:
    name: Verify and deploy Stable Client aliases
    needs: [validate, publish]
    if: needs.validate.outputs.channel == 'stable'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: client-downloads-production
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Configure pinned restricted SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Verify published manifest and Client artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName)"
          jq -e --arg tag "$RELEASE_TAG" \
            '.isDraft == false and .isPrerelease == false and .tagName == $tag' \
            <<<"$release_state" >/dev/null
          mkdir download generated
          gh release download "$RELEASE_TAG" \
            --pattern release-manifest.json --pattern SHA256SUMS --dir download
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$GITHUB_SHA" \
            '.channel == "stable" and .tag == $tag and .commit == $commit' \
            download/release-manifest.json >/dev/null
          mapfile -t client_files < <(jq -r '
            .artifacts[] |
            select(.component == "client" and
              ((.platform == "macos" and .architecture == "universal" and .format == "dmg") or
               (.platform == "windows" and .architecture == "x64" and .format == "exe") or
               (.platform == "linux" and .architecture == "x64" and .format == "deb"))) |
            .filename' download/release-manifest.json)
          test "${#client_files[@]}" -eq 3
          for file in "${client_files[@]}"; do
            gh release download "$RELEASE_TAG" --pattern "$file" --dir download
            gh attestation verify "download/$file" --repo "$GITHUB_REPOSITORY"
          done
          scripts/release/generate_client_download_redirects.sh \
            download/release-manifest.json download/SHA256SUMS download \
            generated/sanad-client-download-redirects.conf
      - uses: actions/upload-artifact@v4
        with:
          name: stable-client-download-redirects-${{ needs.validate.outputs.tag }}
          path: generated/sanad-client-download-redirects.conf
          retention-days: ${{ env.RELEASE_ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
      - name: Candidate, activate, verify, and roll back on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          manifest_sha="$(sha256sum download/release-manifest.json | awk '{print $1}')"
          scripts/release/deploy_production_asset.sh deploy-client-aliases \
            "$RELEASE_TAG" "$manifest_sha" generated/sanad-client-download-redirects.conf

  production-assets:
    name: Deploy Stable Production assets
    needs: [validate, publish, client-download-aliases]
    if: needs.validate.outputs.channel == 'stable'
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.validate.outputs.tag }}
      release_run_id: ${{ github.run_id }}
      deploy_web: true
      deploy_updates: true
      deploy_installers: true
    secrets: inherit
