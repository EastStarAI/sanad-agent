name: Internal TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Monotonically increasing iOS build number
        required: true
        default: '1'
      upload_internal:
        description: Upload to App Store Connect for internal testers only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: internal-testflight
  cancel-in-progress: false

jobs:
  build:
    # macos-26 ships the iOS 26 SDK / Xcode 26 required by App Store Connect
    # for new Internal TestFlight uploads. macos-15 only has the iOS 18.5 SDK
    # and is rejected at upload time. See SANAD-12 Gate 7.
    runs-on: macos-26
    timeout-minutes: 60
    environment: apple-testflight
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - id: contract
        name: Validate release contract
        working-directory: agent
        run: |
          fvm dart pub get
          fvm dart run tool/release_tool.dart validate-contract --repo-root ..
          echo "version=$(jq -r '.version' ../release/release-contract.json)" \
            >> "$GITHUB_OUTPUT"
      - name: Restore Apple Distribution identity and profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$PROFILE_BASE64"
          keychain="$RUNNER_TEMP/sanad-ios.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/sanad.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          uuid="$(security cms -D -i "$RUNNER_TEMP/sanad.mobileprovision" |
            plutil -extract UUID raw -o - -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/sanad.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
      - name: Build signed IPA
        working-directory: client
        run: |
          set -euo pipefail
          fvm flutter pub get
          # The archive must be signed: an unsigned `--no-codesign` archive
          # exports without the app's own CODE_SIGN_ENTITLEMENTS, which silently
          # drops com.apple.developer.associated-domains from the IPA and makes
          # the Universal Link authentication return impossible. Flutter applies
          # release/ios/ExportOptions.plist to the signed archive and exports it.
          fvm flutter build ipa --release \
            --build-name="${{ steps.contract.outputs.version }}" \
            --build-number="${{ inputs.build_number }}" \
            --export-options-plist=release/ios/ExportOptions.plist \
            --dart-define-from-file=config/prod.json
          archive=build/ios/archive/Runner.xcarchive
          test -d "$archive"
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          unzip -q "$ipa" -d "$RUNNER_TEMP/ipa-check"
          app="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # A TestFlight build can only claim the Portal return URL when its
          # distribution profile actually grants Associated Domains. A profile
          # that predates the App ID capability is signed without it, the
          # Universal Link never reaches the app, and iOS login fails in Safari
          # with "Authentication return failed." Fail the build instead.
          entitlements="$RUNNER_TEMP/ipa-entitlements.plist"
          codesign -d --entitlements :- "$app" > "$entitlements" 2>/dev/null
          grep -Fq 'com.apple.developer.associated-domains' "$entitlements" || {
            echo "::error::The exported app is missing the Associated Domains entitlement. Regenerate the App Store provisioning profile after enabling the capability on the App ID, then update IOS_APP_STORE_PROFILE_BASE64."
            exit 1
          }
          for domain in \
            applinks:app.sanad.eaststarai.com \
            applinks:staging.app.sanad.eaststarai.com \
            applinks:dev.app.sanad.eaststarai.com; do
            grep -Fq "$domain" "$entitlements" || {
              echo "::error::The exported app does not claim $domain; the iOS authentication return would open Safari instead of the app."
              exit 1
            }
          done
          embedded_profile="$RUNNER_TEMP/ipa-embedded-profile.plist"
          security cms -D -i "$app/embedded.mobileprovision" > "$embedded_profile"
          exported_profile_name="$(plutil -extract Name raw -o - "$embedded_profile")"
          test "$exported_profile_name" = "Sanad App Store" || {
            echo "::error::The app is signed with '$exported_profile_name' instead of the Sanad App Store profile named by release/ios/ExportOptions.plist, so its entitlement set is not the reviewed one."
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: sanad-ios-internal-${{ inputs.build_number }}
          path: client/build/ios/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error
      - name: Upload for Internal TestFlight
        if: inputs.upload_internal == true
        working-directory: client
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          test -n "$APPLE_API_KEY_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          ipa="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool --upload-app --type ios --file "$ipa" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"
