name: Play pilot trigger

# Temporary: GitHub only dispatches a workflow that already exists on the
# default branch, so this branch-scoped push trigger proves the pilot lane before
# play-internal.yml reaches main. Remove this file once the pilot has run.
on:
  push:
    branches: [ci/play-store-publishing]

permissions:
  contents: read

jobs:
  pilot:
    uses: ./.github/workflows/play-internal.yml
    with:
      build_number: '26'
      track: internal
      upload: true
    secrets: inherit
