name: App Store review submission

# Prepares or submits an iOS build that is already uploaded and processed in App
# Store Connect, then releases it automatically once Apple approves. The binary is
# never built or uploaded here: `.github/workflows/testflight.yml` owns the upload
# and `client/ios/fastlane/Fastfile` owns the submission.
#
# `submit: false` writes the version, its store copy, and the automatic release
# type without submitting; the same dispatch with `submit: true` submits it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to submit; must match the release contract
        required: true
        type: string
      build_number:
        description: Build number already processed in App Store Connect
        required: true
        type: string
      submit:
        description: Submit for review (off prepares the version without submitting)
        type: boolean
        default: false
  # Callable so a release pipeline reuses the proven lane. A caller that does not
  # pass `secrets: inherit` must supply all three declared secrets.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      submit:
        required: false
        default: false
        type: boolean
    secrets:
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER_ID:
        required: true
      APPLE_API_PRIVATE_KEY_P8_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: appstore-submit
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APPSTORE_APP_IDENTIFIER: com.eaststarai.sanad
  # Bounded well inside the job timeout, so a build that never finishes
  # processing fails closed instead of being killed mid-write.
  APPSTORE_PROCESSING_TIMEOUT_SECONDS: '1800'

jobs:
  submit:
    # Only this repository, and only `main` or a release tag, may reach the App
    # Manager key through `apple-testflight`. This lane can publish a release
    # without further approval, so a pushed branch must not be able to dispatch it.
    if: >-
      github.repository == 'EastStarAI/sanad-agent' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-26
    timeout-minutes: 45
    environment: apple-testflight
    # Inputs reach the lane through the environment, never interpolated into a
    # shell script, and a called workflow's free-form strings are validated here.
    env:
      APPSTORE_VERSION: ${{ inputs.version }}
      APPSTORE_BUILD_NUMBER: ${{ inputs.build_number }}
      APPSTORE_SUBMIT: ${{ inputs.submit }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate the requested identity
        shell: bash
        run: |
          set -euo pipefail
          contract_version="$(jq -r '.version' release/release-contract.json)"
          contract_build_number="$(jq -r '.build_number' release/release-contract.json)"
          test -n "$contract_version"
          if [[ "$APPSTORE_VERSION" != "$contract_version" ]]; then
            echo "::error::version '$APPSTORE_VERSION' differs from the release contract version '$contract_version'"
            exit 1
          fi
          if [[ "$APPSTORE_BUILD_NUMBER" != "$contract_build_number" ]]; then
            echo "::error::build_number '$APPSTORE_BUILD_NUMBER' differs from the release contract build number '$contract_build_number'"
            exit 1
          fi
          if [[ ! "$APPSTORE_SUBMIT" =~ ^(true|false)$ ]]; then
            echo "::error::submit must be true or false, got '$APPSTORE_SUBMIT'"
            exit 1
          fi
      - name: Validate the store copy
        shell: bash
        run: |
          set -euo pipefail
          # The curated text belongs to one release, so refuse it here instead of
          # after the build-processing wait.
          python3 scripts/release/store_whats_new.py \
            --version "$APPSTORE_VERSION" --limit app-store
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: client/ios
      - name: Restore the App Store Connect API key
        shell: bash
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY_ID"
          test -n "$KEY_BASE64"
          # Written outside the checkout and never printed: fastlane reads the path.
          printf '%s' "$KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Prepare or submit the App Store version
        working-directory: client/ios
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: bundle exec fastlane ios submit_review
