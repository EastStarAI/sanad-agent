name: App Store submission

# Manual App Store Connect submission lane. It builds nothing: the Internal
# TestFlight lane already produced and uploaded the IPA, so this lane owns only
# what happens after that upload. It waits for the build to finish processing,
# reuses or creates the App Store version, copies the released version's
# metadata, applies the curated store copy, attaches the build, submits the
# review submission, and verifies WAITING_FOR_REVIEW. It creates no tag and no
# GitHub Release.
#
# Owner decision (2026-11-15): every release goes to the real stores, and Apple
# releases the approved version (releaseType AFTER_APPROVAL), so the metadata and
# the build must be final before this lane submits.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to submit (must match release/release-contract.json)
        required: true
        type: string
      build_number:
        description: Uploaded iOS build number to submit (must match the contract)
        required: true
        type: string
      submit:
        description: Submit for App Store review (off resolves and prints the plan only)
        type: boolean
        default: false
      processing_timeout_seconds:
        description: Seconds to wait for App Store Connect to finish processing the build
        required: false
        default: '1800'
        type: string
  # Callable so the release workflow can reuse a proven lane without duplicating
  # the submission contract. The caller passes the App Store Connect secret set
  # explicitly (or with `secrets: inherit`); nothing is reached implicitly.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      submit:
        required: false
        default: false
        type: boolean
      processing_timeout_seconds:
        required: false
        default: '1800'
        type: string
    secrets:
      APPLE_API_KEY_ID:
        required: true
      APPLE_API_ISSUER_ID:
        required: true
      APPLE_API_PRIVATE_KEY_P8_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: appstore-submit
  cancel-in-progress: false

env:
  ASC_APP_ID: '6794974223'
  ASC_BUNDLE_ID: com.eaststarai.sanad

jobs:
  submit:
    # Two guards, because this lane holds a key that can now publish: the
    # repository, and the ref. `workflow_dispatch` runs the workflow file from any
    # branch that contains it, so only `main` or a release tag may reach the
    # `apple-testflight` Environment. A fork or another ref can never reach it.
    if: >-
      github.repository == 'EastStarAI/sanad-agent' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: apple-testflight
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
      SUBMIT_FOR_REVIEW: ${{ inputs.submit }}
      PROCESSING_TIMEOUT_SECONDS: ${{ inputs.processing_timeout_seconds }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate the request against the release contract
        shell: bash
        run: |
          set -euo pipefail
          contract_version="$(jq -r '.version' release/release-contract.json)"
          contract_build="$(jq -r '.build_number' release/release-contract.json)"
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a marketing version, got '$REQUESTED_VERSION'."
            exit 1
          fi
          if [[ "$REQUESTED_VERSION" != "$contract_version" ]]; then
            echo "::error::Requested version '$REQUESTED_VERSION' but the release contract declares '$contract_version'."
            exit 1
          fi
          if [[ ! "$REQUESTED_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number must be a positive integer, got '$REQUESTED_BUILD_NUMBER'."
            exit 1
          fi
          if [[ "$REQUESTED_BUILD_NUMBER" != "$contract_build" ]]; then
            echo "::error::Requested build '$REQUESTED_BUILD_NUMBER' but the release contract declares '$contract_build'."
            exit 1
          fi
          if [[ ! "$PROCESSING_TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::processing_timeout_seconds must be a positive integer, got '$PROCESSING_TIMEOUT_SECONDS'."
            exit 1
          fi
          # The job is capped at 45 minutes; a larger wait would be SIGKILLed
          # mid-run instead of failing with a readable message.
          if (( PROCESSING_TIMEOUT_SECONDS > 2400 )); then
            echo "::error::processing_timeout_seconds must not exceed 2400 (the job timeout is 45 minutes)."
            exit 1
          fi
          echo "Requested Sanad $contract_version ($contract_build); submit: $SUBMIT_FOR_REVIEW."
      - name: Submit the uploaded build for review
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$APPLE_API_KEY_BASE64"
          args=(
            --version "$REQUESTED_VERSION"
            --build-number "$REQUESTED_BUILD_NUMBER"
            --expect-app-id "$ASC_APP_ID"
            --bundle-id "$ASC_BUNDLE_ID"
            --processing-timeout-seconds "$PROCESSING_TIMEOUT_SECONDS"
          )
          if [[ "$SUBMIT_FOR_REVIEW" != "true" ]]; then
            args+=(--dry-run)
          fi
          python3 scripts/release/appstore_submit.py "${args[@]}"
