name: Play internal pilot upload

# Manual proof of the Google Play publishing path. It builds one signed Android
# App Bundle from the current checkout, uploads it to a Play testing track, and
# verifies the versionCode the track received afterwards. It creates no tag, no
# GitHub Release, and never touches the Production track, so the release
# workflow stays unchanged until this lane is proven.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Monotonically increasing versionCode (must exceed the highest uploaded one)
        required: true
        type: string
      build_name:
        description: Version name to build (empty uses the release contract version)
        required: false
        default: ''
        type: string
      track:
        description: Play track to receive the upload
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
      upload:
        description: Upload to Google Play (off builds and verifies only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-internal-pilot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAY_PACKAGE_ID: com.eaststarai.sanad

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-signing
    outputs:
      build_name: ${{ steps.identity.outputs.build_name }}
      build_number: ${{ steps.identity.outputs.build_number }}
      artifact: ${{ steps.identity.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-fvm
      - id: identity
        name: Resolve the build identity
        shell: bash
        run: |
          set -euo pipefail
          contract_version="$(jq -r '.version' release/release-contract.json)"
          build_name="${{ inputs.build_name }}"
          if [[ -z "$build_name" ]]; then build_name="$contract_version"; fi
          build_number="${{ inputs.build_number }}"
          if ! [[ "$build_number" =~ ^[0-9]+$ ]] || [[ "$build_number" -le 0 ]]; then
            echo "::error::build_number must be a positive integer, got '$build_number'"
            exit 1
          fi
          {
            echo "build_name=$build_name"
            echo "build_number=$build_number"
            echo "artifact=dist/sanad-client-${build_name}-android-universal.aab"
          } >> "$GITHUB_OUTPUT"
      - name: Restore Android signing material
        working-directory: client
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sanad-release.jks"
          chmod 600 "$RUNNER_TEMP/sanad-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/sanad-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          chmod 600 android/key.properties
      - name: Build and verify the signed App Bundle
        working-directory: client
        run: |
          set -euo pipefail
          fvm flutter pub get
          bash release/android/build_signed_aab.sh \
            --build-name="${{ steps.identity.outputs.build_name }}" \
            --build-number="${{ steps.identity.outputs.build_number }}" \
            --env-config=config/prod.json \
            --output-dir=../dist
      - uses: actions/upload-artifact@v4
        with:
          name: play-pilot-android
          path: dist/*.aab
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.upload == true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: google-play-publishing
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: play-pilot-android
          path: dist
      - name: Upload the bundle and verify the published track
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$PLAY_SERVICE_ACCOUNT_JSON_BASE64"
          bundle="dist/sanad-client-${{ needs.build.outputs.build_name }}-android-universal.aab"
          test -s "$bundle"
          python3 scripts/release/publish_play_bundle.py \
            --bundle "$bundle" \
            --package "$PLAY_PACKAGE_ID" \
            --track "${{ inputs.track }}" \
            --expect-version-code "${{ needs.build.outputs.build_number }}" \
            --version-name "${{ needs.build.outputs.build_name }}"
