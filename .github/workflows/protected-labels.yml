name: Protected label review

# Public CI no longer subscribes to label events. When a protected review label
# is added or removed, this workflow re-runs only the "Verify protected review
# labels" job of the latest Public CI run for the current head SHA. GitHub also
# re-runs its dependent "All required checks pass" job, which keeps the results
# of every other job from that same run. Ordinary labels skip the job.
# This workflow must never define a job named "All required checks pass".

on:
  pull_request:
    types: [labeled, unlabeled]

permissions:
  actions: write
  pull-requests: read

concurrency:
  # Protected-label events of one PR share a group so the newest one wins;
  # ordinary-label events get a unique group and cannot cancel anything.
  group: protected-labels-${{ github.event.pull_request.number }}-${{ contains(fromJSON('["maintainer-reviewed","security-reviewed","release-reviewed"]'), github.event.label.name) && 'protected' || github.run_id }}
  cancel-in-progress: true

jobs:
  rerun-protected-review:
    name: Re-verify protected review labels
    if: >-
      github.event.pull_request.state == 'open' &&
      contains(fromJSON('["maintainer-reviewed","security-reviewed","release-reviewed"]'), github.event.label.name)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_JOB: Verify protected review labels
          POLL_SECONDS: 30
          MAX_WAIT_SECONDS: 4800
        run: |
          set -euo pipefail
          head_sha() { gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha'; }
          sha="$(head_sha)"
          echo "Waiting for the latest Public CI run for $sha."
          deadline=$((SECONDS + MAX_WAIT_SECONDS))
          while :; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$sha&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"')"
            if [[ -n "$run" ]]; then
              read -r run_id run_status <<< "$run"
              if [[ "$run_status" == completed ]]; then break; fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::No completed Public CI run for $sha within the wait limit; re-run '$REVIEW_JOB' manually."
              exit 1
            fi
            sleep "$POLL_SECONDS"
          done
          if [[ "$(head_sha)" != "$sha" ]]; then
            echo "Head moved past $sha; the new Public CI run reads current labels itself."
            exit 0
          fi
          job_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            | jq -r --arg name "$REVIEW_JOB" '.jobs[] | select(.name == $name) | .id')"
          if [[ -z "$job_id" ]]; then
            echo "::error::Public CI run $run_id has no '$REVIEW_JOB' job."
            exit 1
          fi
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/actions/jobs/$job_id/rerun" > /dev/null; then
            echo "::error::Could not re-run '$REVIEW_JOB' in Public CI run $run_id (fork pull requests get a read-only token). A maintainer must re-run that job manually."
            exit 1
          fi
          echo "Re-ran '$REVIEW_JOB' and its dependents in Public CI run $run_id for $sha."
