name: Deploy prepared release assets

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing immutable GitHub Release tag
        required: true
        type: string
      release_run_id:
        description: Successful release workflow run containing private Web handoff artifacts
        required: true
        type: string
      deploy_web:
        required: true
        type: boolean
      deploy_updates:
        required: true
        type: boolean
      deploy_installers:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable GitHub Release tag
        required: true
        default: v1.0.1
      release_run_id:
        description: Successful release workflow run containing private Web handoff artifacts
        required: true
      deploy_web:
        type: boolean
        default: false
      deploy_updates:
        type: boolean
        default: false
      deploy_installers:
        type: boolean
        default: false

permissions:
  contents: read
  attestations: read

concurrency:
  group: production-assets
  cancel-in-progress: false

jobs:
  web:
    if: inputs.deploy_web == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: client-downloads-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure pinned SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Fetch attested Web artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected_sha="$(git rev-parse HEAD)"
          run_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          test "$(jq -r '.conclusion' <<<"$run_metadata")" = success
          test "$(jq -r '.path' <<<"$run_metadata")" = .github/workflows/release.yml
          test "$(jq -r '.head_sha' <<<"$run_metadata")" = "$expected_sha"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft == false' | grep -Fxq true
          gh run download "$RELEASE_RUN_ID" \
            --name stable-release-candidate \
            --dir download
          web_artifact="$(find download -maxdepth 1 \
            -name 'sanad-client-*-web-universal.tar.gz' -print -quit)"
          test -n "$web_artifact"
          gh attestation verify "$web_artifact" \
            --repo "${{ github.repository }}"
          mkdir web
          tar -xzf "$web_artifact" -C web
          test -s web/index.html
          grep -Fq 'flutter_bootstrap.js' web/index.html
          test -s web/flutter_bootstrap.js
          test -s web/favicon.svg
          test "$(cat web/sanad-public-sha.txt)" = "$expected_sha"
          jq -e --arg version "${RELEASE_TAG#v}" \
            '.version == $version and (.build | type == "number")' \
            web/version.json >/dev/null
          find web -type d -exec chmod 755 {} +
          find web -type f -exec chmod 644 {} +
          test -z "$(find web -type f ! -perm -004 -print -quit)"
      - name: Publish immutable Production Web release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          expected_sha="$(git rev-parse HEAD)"
          incoming="/opt/sanad-sites/assets/web/incoming-$tag-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          release="/opt/sanad-sites/assets/web/releases/$tag"
          if ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; test -s '$release/index.html'; test \"\$(cat '$release/sanad-public-sha.txt')\" = '$expected_sha'"; then
            echo "Reusing the existing immutable Production Web release $release."
            exit 0
          fi
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; test ! -e '$incoming'; test ! -e '$release'; mkdir -p '$incoming' /opt/sanad-sites/assets/web/releases"
          rsync -az --delete --delay-updates web/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$incoming/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; find '$incoming' -type d -exec chmod 755 {} +; find '$incoming' -type f -exec chmod 644 {} +; test -z \"\$(find '$incoming' -type f ! -perm -004 -print -quit)\"; test -s '$incoming/index.html'; grep -Fq flutter_bootstrap.js '$incoming/index.html'; test \"\$(cat '$incoming/sanad-public-sha.txt')\" = '$expected_sha'; test ! -e '$release'; mv '$incoming' '$release'"
      - name: Activate, verify, and roll back Production Web on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release="/opt/sanad-sites/assets/web/releases/$RELEASE_TAG"
          selector=/opt/sanad-sites/assets/web/current
          expected_sha="$(git rev-parse HEAD)"
          previous="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; readlink -f '$selector'")"
          test -n "$previous"
          previous_index_sha="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; sha256sum '$previous/index.html' | cut -d ' ' -f 1")"
          test -n "$previous_index_sha"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; test -s '$release/index.html'; test \"\$(cat '$release/sanad-public-sha.txt')\" = '$expected_sha'; ln -sfn '$release' '$selector'; sudo /usr/local/sbin/sanad-sites-control refresh-static production web"

          verify_web() {
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN
            curl --fail --silent --show-error --location --max-time 20 \
              --output "$body" "https://app.sanad.eaststarai.com/?source=$expected_sha"
            grep -Fq 'flutter_bootstrap.js' "$body"
            curl --fail --silent --show-error --max-time 20 \
              "https://app.sanad.eaststarai.com/flutter_bootstrap.js?source=$expected_sha" >/dev/null
            curl --fail --silent --show-error --max-time 20 \
              "https://app.sanad.eaststarai.com/favicon.svg?source=$expected_sha" >/dev/null
            served_sha="$(curl --fail --silent --show-error --max-time 20 \
              "https://app.sanad.eaststarai.com/sanad-public-sha.txt?source=$expected_sha")"
            test "$served_sha" = "$expected_sha"
          }

          activated=false
          for attempt in $(seq 1 12); do
            if verify_web; then
              activated=true
              break
            fi
            sleep 5
          done
          if [[ "$activated" != true ]]; then
            echo "Production Web verification failed; restoring the previous selector."
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; test -s '$previous/index.html'; ln -sfn '$previous' '$selector'; sudo /usr/local/sbin/sanad-sites-control refresh-static production web"
            rollback_verified=false
            for attempt in $(seq 1 12); do
              rolled_back_index="$(mktemp)"
              if curl --fail --silent --show-error --location --max-time 20 \
                --output "$rolled_back_index" \
                "https://app.sanad.eaststarai.com/?rollback=$previous_index_sha" && \
                [[ "$(sha256sum "$rolled_back_index" | cut -d ' ' -f 1)" == "$previous_index_sha" ]]; then
                rollback_verified=true
                rm -f "$rolled_back_index"
                break
              fi
              rm -f "$rolled_back_index"
              sleep 5
            done
            if [[ "$rollback_verified" != true ]]; then
              echo "Production Web rollback verification failed." >&2
            fi
            exit 1
          fi

  updates:
    if: inputs.deploy_updates == true
    runs-on: ubuntu-24.04
    environment: client-downloads-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure pinned SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Fetch verified Appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --pattern appcast.xml \
            --pattern SHA256SUMS \
            --dir download
          (cd download && sha256sum --check SHA256SUMS --ignore-missing)
          gh attestation verify download/appcast.xml \
            --repo "$GITHUB_REPOSITORY"
      - name: Activate, verify, and roll back Appcast on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          release="/opt/sanad-sites/assets/updates/releases/$tag"
          selector=/opt/sanad-sites/assets/updates/current
          expected_sha="$(sha256sum download/appcast.xml | awk '{print $1}')"
          previous="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; readlink -f '$selector'")"
          previous_sha="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; sha256sum '$previous/appcast.xml' | awk '{print \$1}'")"
          if ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; test -s '$release/appcast.xml'; test \"\$(sha256sum '$release/appcast.xml' | awk '{print \$1}')\" = '$expected_sha'"; then
            echo "Reusing the existing immutable Appcast release $release."
          else
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; test ! -e '$release'; mkdir -p '$release'"
            rsync -az download/appcast.xml \
              "$DEPLOY_USER@$DEPLOY_HOST:$release/appcast.xml"
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; test \"\$(sha256sum '$release/appcast.xml' | awk '{print \$1}')\" = '$expected_sha'"
          fi
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; ln -sfn '$release' '$selector'; sudo /usr/local/sbin/sanad-sites-control refresh-static production updates"

          public_appcast="$(mktemp)"
          rollback_appcast="$(mktemp)"
          trap 'rm -f "$public_appcast" "$rollback_appcast"' EXIT
          if ! curl --fail --silent --show-error --max-time 20 \
            "https://updates.sanad.eaststarai.com/appcast.xml?release=$tag" \
            -o "$public_appcast" || \
            [[ "$(sha256sum "$public_appcast" | awk '{print $1}')" != "$expected_sha" ]]; then
            echo "Appcast verification failed; restoring the previous selector."
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; ln -sfn '$previous' '$selector'; sudo /usr/local/sbin/sanad-sites-control refresh-static production updates"
            curl --fail --silent --show-error --max-time 20 \
              "https://updates.sanad.eaststarai.com/appcast.xml?rollback=$previous_sha" \
              -o "$rollback_appcast"
            test "$(sha256sum "$rollback_appcast" | awk '{print $1}')" = "$previous_sha"
            exit 1
          fi

  installers:
    if: inputs.deploy_installers == true
    runs-on: ubuntu-24.04
    environment: client-downloads-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure pinned SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Activate, verify, and roll back installer sources on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          release="/opt/sanad-sites/assets/install/releases/$revision"
          selector=/opt/sanad-sites/assets/install/current
          expected_sh="$(sha256sum scripts/install.sh | awk '{print $1}')"
          expected_ps1="$(sha256sum scripts/install.ps1 | awk '{print $1}')"
          previous="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" "set -eu; readlink -f '$selector'")"
          previous_sh="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; sha256sum '$previous/install.sh' | awk '{print \$1}'")"
          previous_ps1="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; sha256sum '$previous/install.ps1' | awk '{print \$1}'")"
          if ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; test \"\$(sha256sum '$release/install.sh' | awk '{print \$1}')\" = '$expected_sh'; test \"\$(sha256sum '$release/install.ps1' | awk '{print \$1}')\" = '$expected_ps1'"; then
            echo "Reusing the existing immutable installer release $release."
          else
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; test ! -e '$release'; mkdir -p '$release'"
            rsync -az scripts/install.sh scripts/install.ps1 \
              "$DEPLOY_USER@$DEPLOY_HOST:$release/"
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; test \"\$(sha256sum '$release/install.sh' | awk '{print \$1}')\" = '$expected_sh'; test \"\$(sha256sum '$release/install.ps1' | awk '{print \$1}')\" = '$expected_ps1'"
          fi
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu; ln -sfn '$release' '$selector'; sudo /usr/local/sbin/sanad-sites-control refresh-static production downloads"

          verify_installer() {
            local name="$1" expected="$2" output="$3" marker="$4"
            curl --fail --silent --show-error --max-time 20 \
              "https://downloads.sanad.eaststarai.com/$name?$marker" -o "$output"
            test "$(sha256sum "$output" | awk '{print $1}')" = "$expected"
          }

          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          if ! verify_installer install.sh "$expected_sh" "$temporary/install.sh" "release=$revision" || \
            ! verify_installer install.ps1 "$expected_ps1" "$temporary/install.ps1" "release=$revision"; then
            echo "Installer verification failed; restoring the previous selector."
            ssh "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; ln -sfn '$previous' '$selector'; sudo /usr/local/sbin/sanad-sites-control refresh-static production downloads"
            verify_installer install.sh "$previous_sh" "$temporary/rollback.sh" "rollback=$previous_sh"
            verify_installer install.ps1 "$previous_ps1" "$temporary/rollback.ps1" "rollback=$previous_ps1"
            exit 1
          fi
