name: Deploy prepared release assets

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing immutable GitHub Release tag
        required: true
        type: string
      release_run_id:
        description: Successful release workflow run containing private Web handoff artifacts
        required: true
        type: string
      deploy_web:
        required: true
        type: boolean
      deploy_updates:
        required: true
        type: boolean
      deploy_installers:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable GitHub Release tag
        required: true
        default: v1.0.1
      release_run_id:
        description: Successful release workflow run containing private Web handoff artifacts
        required: true
      deploy_web:
        type: boolean
        default: false
      deploy_updates:
        type: boolean
        default: false
      deploy_installers:
        type: boolean
        default: false

permissions:
  contents: read
  attestations: read

concurrency:
  group: production-assets
  cancel-in-progress: false

jobs:
  web:
    if: inputs.deploy_web == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: client-downloads-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure pinned SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Fetch attested Web artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          expected_sha="$(git rev-parse HEAD)"
          run_metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$run_metadata")"
          test "$run_conclusion" = "success" || test "$run_conclusion" = "failure" || test -z "$run_conclusion"
          test "$(jq -r '.path' <<<"$run_metadata")" = .github/workflows/release.yml
          test "$(jq -r '.head_sha' <<<"$run_metadata")" = "$expected_sha"
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft == false' | grep -Fxq true
          gh run download "$RELEASE_RUN_ID" \
            --name stable-release-candidate \
            --dir download
          web_artifact="$(find download -maxdepth 1 \
            -name 'sanad-client-*-web-universal.tar.gz' -print -quit)"
          test -n "$web_artifact"
          gh attestation verify "$web_artifact" \
            --repo "${{ github.repository }}"
          mkdir web
          tar -xzf "$web_artifact" -C web
          test -s web/index.html
          grep -Fq 'flutter_bootstrap.js' web/index.html
          test -s web/flutter_bootstrap.js
          test -s web/favicon.svg
          test "$(cat web/sanad-public-sha.txt)" = "$expected_sha"
          jq -e --arg version "${RELEASE_TAG#v}" \
            '.version == $version and (.build | type == "number")' \
            web/version.json >/dev/null
          find web -type d -exec chmod 755 {} +
          find web -type f -exec chmod 644 {} +
          test -z "$(find web -type f ! -perm -004 -print -quit)"
      - id: publish_asset
        name: Publish immutable Production Web release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          digest="$(scripts/release/deploy_production_asset.sh \
            publish static-web "$expected_sha" web)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Activate, verify, and roll back Production Web on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          read -r previous_identity previous_digest \
            <<<"$(scripts/release/deploy_production_asset.sh previous static-web)"
          scripts/release/deploy_production_asset.sh activate static-web \
            "$expected_sha" "${{ steps.publish_asset.outputs.digest }}"

          verify_web() {
            body="$(mktemp)"
            trap 'rm -f "$body"' RETURN
            curl --fail --silent --show-error --location --max-time 20 \
              --output "$body" "https://app.sanad.eaststarai.com/?source=$expected_sha"
            grep -Fq 'flutter_bootstrap.js' "$body"
            curl --fail --silent --show-error --max-time 20 \
              "https://app.sanad.eaststarai.com/flutter_bootstrap.js?source=$expected_sha" >/dev/null
            curl --fail --silent --show-error --max-time 20 \
              "https://app.sanad.eaststarai.com/favicon.svg?source=$expected_sha" >/dev/null
            served_sha="$(curl --fail --silent --show-error --max-time 20 \
              "https://app.sanad.eaststarai.com/sanad-public-sha.txt?source=$expected_sha")"
            test "$served_sha" = "$expected_sha"
          }

          activated=false
          for attempt in $(seq 1 12); do
            if verify_web; then
              activated=true
              break
            fi
            sleep 5
          done
          if [[ "$activated" != true ]]; then
            echo "Production Web verification failed; restoring the previous selector."
            scripts/release/deploy_production_asset.sh rollback static-web \
              "$previous_identity" "$previous_digest"
            rollback_verified=false
            for attempt in $(seq 1 12); do
              served_previous="$(curl --fail --silent --show-error --max-time 20 \
                "https://app.sanad.eaststarai.com/sanad-public-sha.txt?rollback=$previous_identity" || true)"
              if [[ "$served_previous" == "$previous_identity" ]]; then
                rollback_verified=true
                break
              fi
              sleep 5
            done
            if [[ "$rollback_verified" != true ]]; then
              echo "Production Web rollback verification failed." >&2
            fi
            exit 1
          fi

  updates:
    if: inputs.deploy_updates == true
    runs-on: ubuntu-24.04
    environment: client-downloads-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure pinned SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Fetch verified Appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --pattern appcast.xml \
            --pattern release-manifest.json \
            --pattern SHA256SUMS \
            --dir download
          (cd download && sha256sum --check SHA256SUMS --ignore-missing)
          gh attestation verify download/appcast.xml \
            --repo "$GITHUB_REPOSITORY"
          gh attestation verify download/release-manifest.json \
            --repo "$GITHUB_REPOSITORY"
      - name: Activate, verify, and roll back updates on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          tag="${{ inputs.release_tag }}"
          revision="$(git rev-parse HEAD)"
          expected_appcast="$(sha256sum download/appcast.xml | awk '{print $1}')"
          expected_manifest="$(sha256sum download/release-manifest.json | awk '{print $1}')"
          read -r previous_identity previous_digest \
            <<<"$(scripts/release/deploy_production_asset.sh previous static-updates)"
          previous_appcast="$(scripts/release/deploy_production_asset.sh hash static-updates appcast.xml)"
          previous_manifest="$(scripts/release/deploy_production_asset.sh hash static-updates release-manifest.json)"
          digest="$(scripts/release/deploy_production_asset.sh \
            publish static-updates "$revision" download)"
          scripts/release/deploy_production_asset.sh activate static-updates "$revision" "$digest"

          verify_update() {
            local name="$1" expected="$2" output="$3" marker="$4"
            curl --fail --silent --show-error --max-time 20 \
              "https://updates.sanad.eaststarai.com/$name?$marker" -o "$output"
            test "$(sha256sum "$output" | awk '{print $1}')" = "$expected"
          }

          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          if ! verify_update appcast.xml "$expected_appcast" "$temporary/appcast.xml" "release=$tag" || \
            ! verify_update release-manifest.json "$expected_manifest" "$temporary/release-manifest.json" "release=$tag"; then
            echo "Updates verification failed; restoring the previous selector."
            scripts/release/deploy_production_asset.sh rollback static-updates \
              "$previous_identity" "$previous_digest"
            verify_update appcast.xml "$previous_appcast" "$temporary/rollback-appcast.xml" "rollback=$previous_appcast"
            verify_update release-manifest.json "$previous_manifest" "$temporary/rollback-manifest.json" "rollback=$previous_manifest"
            exit 1
          fi

  installers:
    if: inputs.deploy_installers == true
    runs-on: ubuntu-24.04
    environment: client-downloads-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Configure pinned SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Activate, verify, and roll back installer sources on failure
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          expected_sh="$(sha256sum scripts/install.sh | awk '{print $1}')"
          expected_ps1="$(sha256sum scripts/install.ps1 | awk '{print $1}')"
          read -r previous_identity previous_digest \
            <<<"$(scripts/release/deploy_production_asset.sh previous static-downloads)"
          previous_sh="$(scripts/release/deploy_production_asset.sh hash static-downloads install.sh)"
          previous_ps1="$(scripts/release/deploy_production_asset.sh hash static-downloads install.ps1)"
          digest="$(scripts/release/deploy_production_asset.sh \
            publish static-downloads "$revision" scripts)"
          scripts/release/deploy_production_asset.sh activate static-downloads "$revision" "$digest"

          verify_installer() {
            local name="$1" expected="$2" output="$3" marker="$4"
            curl --fail --silent --show-error --max-time 20 \
              "https://downloads.sanad.eaststarai.com/$name?$marker" -o "$output"
            test "$(sha256sum "$output" | awk '{print $1}')" = "$expected"
          }

          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          if ! verify_installer install.sh "$expected_sh" "$temporary/install.sh" "release=$revision" || \
            ! verify_installer install.ps1 "$expected_ps1" "$temporary/install.ps1" "release=$revision"; then
            echo "Installer verification failed; restoring the previous selector."
            scripts/release/deploy_production_asset.sh rollback static-downloads \
              "$previous_identity" "$previous_digest"
            verify_installer install.sh "$previous_sh" "$temporary/rollback.sh" "rollback=$previous_sh"
            verify_installer install.ps1 "$previous_ps1" "$temporary/rollback.ps1" "rollback=$previous_ps1"
            exit 1
          fi
