import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseKeyProperties = new Properties()
def releaseKeyPropertiesFile = rootProject.file("key.properties")
if (releaseKeyPropertiesFile.exists()) {
    releaseKeyProperties.load(new FileInputStream(releaseKeyPropertiesFile))
}

def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}
if (releaseTaskRequested && !releaseKeyPropertiesFile.exists()) {
    throw new GradleException(
        "Release signing requires android/key.properties generated outside Git."
    )
}

android {
    namespace = "com.eaststarai.sanad"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = "28.2.13676358"

    compileOptions {
        // `flutter_local_notifications` (desktop OS notifications) is compiled
        // into every Android build and relies on library desugaring even when
        // no scheduled notification is used.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.eaststarai.sanad"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseKeyPropertiesFile.exists()) {
                keyAlias = releaseKeyProperties["keyAlias"]
                keyPassword = releaseKeyProperties["keyPassword"]
                storeFile = file(releaseKeyProperties["storeFile"])
                storePassword = releaseKeyProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeyPropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Required by `flutter_local_notifications` (see compileOptions above).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
