[extend]
useDefault = true

[[allowlists]]
description = "Synthetic generic API-key fixtures used by credential and redaction tests"
rules = ["generic-api-key"]
paths = [
  '''^agent/test/core/provider_runtime/provider_instance_service_test\.dart$''',
  '''^agent/test/core/secrets_redactor_test\.dart$''',
  '''^agent/test/engine/adapters/codex_wire_pressure_regression_test\.dart$''',
  '''^agent/test/interfaces/interfaces_test\.dart$''',
  '''^agent/test/interfaces/remote_device_control_g6_security_test\.dart$''',
  '''^client/test/unit/services/sanad_socket_service_test\.dart$''',
]

[[allowlists]]
description = "Published synthetic credential shapes used as redaction fixtures and documented examples"
paths = [
  '''^agent/test/core/secrets_redactor_test\.dart$''',
  '''^agent/test/interfaces/notifications/notification_payload_test\.dart$''',
  '''^agent/lib/core/secrets_redactor\.dart$''',
  '''^docs/technical/communication_protocols\.md$''',
]
regexTarget = "match"
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''ASIAY34FZKBOKMUTVV7A''',
  '''ghp_16C7e42F292c6912E7710c838347Ae178B4a''',
  '''github_pat_11ABCDEFG0123456789_abcdefghijklmnopqrstuvwxyz''',
  '''glpat-ABCDEFGHIJKLMNOPQRST''',
]

[[allowlists]]
description = "CocoaPods SPEC CHECKSUMS in the macOS lockfile are podspec hashes, not credentials"
rules = ["generic-api-key"]
paths = [
  '''^client/macos/Podfile\.lock$''',
]
